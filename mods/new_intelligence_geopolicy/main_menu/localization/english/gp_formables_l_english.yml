l_english:
 # === New Intelligence: Geopolicy - regional formable countries, batch 2 (gp_formables.txt) ===
 # <TAG> / <TAG>_ADJ / <TAG>_THE (article in "Kingdom of the ...") and <key> / <key>_desc. VLR and GLH keep their vanilla names.
 MDC: "Aragon and the Sicilies"
 MDC_ADJ: "Aragonese"
 gp_mediterranean_crown_f: "Mediterranean Crown"
 gp_mediterranean_crown_f_desc: "Since the Vespers of 1282 the House of Barcelona has been gathering the islands of the western sea: Sicily, Majorca, Sardinia. Add Naples, as Alfonso the Magnanimous would in 1442, and one court rules from Barcelona to the Strait of Otranto: the Crown of Aragon becomes the crown of the Mediterranean."
 VSM: "Stato da Mar"
 VSM_ADJ: "Venetian"
 gp_stato_da_mar_f: "Stato da Mar"
 gp_stato_da_mar_f_desc: "Zara and the Dalmatian ports, Modon and Coron - 'the eyes of the Republic' - Negroponte and Candia: whoever holds them all holds the road to the Levant. With the Veneto, Dalmatia, the Morea and Crete under the Lion of Saint Mark, Venice is no longer a city with colonies but an empire of the sea."
 BCR: "Bohemian Crown"
 BCR_ADJ: "Bohemian"
 BCR_THE: "$common_string_prefix_article$"
 gp_bohemian_crown_f: "Lands of the Bohemian Crown"
 gp_bohemian_crown_f_desc: "In 1348 Charles IV declared Bohemia, Moravia, Silesia and Lusatia one indivisible Crown of the Kingdom of Bohemia. With Prague, Silesia and every land of his charter in our hands, the Crown is no longer a line in a charter but a state."
 DNM: "Danubian Monarchy"
 DNM_ADJ: "Danubian"
 DNM_THE: "$common_string_prefix_article$"
 gp_danubian_monarchy_f: "Danubian Monarchy"
 gp_danubian_monarchy_f_desc: "Albert of Habsburg wore the crowns of Hungary and Bohemia in 1438 and died the next year; only after Mohács would Ferdinand I win them back for his house. If Vienna, Prague and Buda answer to one dynasty, the Danube from the Alps to the Great Plain becomes the spine of a single monarchy."
 LRS: "Lithuania and Rus'"
 LRS_ADJ: "Lithuanian"
 gp_lithuania_rus_f: "Lithuania and Rus'"
 gp_lithuania_rus_f_desc: "Gediminas wrote himself king of the Lithuanians and many Ruthenians, and Algirdas declared that all Rus' must belong to Lithuania. With Vilnius, Kyiv and three quarters of the lands of Rus' in our hands, the Grand Duchy can take the royal crown that history would deny Vytautas in 1430."
 SGK: "Serbs and Greeks"
 SGK_ADJ: "Serbian"
 SGK_THE: "$common_string_prefix_article$"
 gp_serbian_empire_f: "Empire of the Serbs and Greeks"
 gp_serbian_empire_f_desc: "At Easter 1346 Stefan Dušan was crowned at Skopje as Emperor of the Serbs and Greeks and ruled from the Danube to Thessaly; he died in 1355 with Constantinople still before him. Serbia, Macedonia, Albania, Epirus and Thessaly under one tsar - and this time the empire does not die with its founder."
 LOM: "Lombardy"
 LOM_ADJ: "Lombard"
 gp_lombardy_f: "Kingdom of Lombardy"
 gp_lombardy_f_desc: "Gian Galeazzo Visconti bought the ducal title of Milan in 1395 and was preparing a royal coronation when the plague killed him in 1402. With Lombardy, Emilia, Piedmont and the Veneto mainland under the Visconti serpent, Milan can take the Iron Crown and stand as a kingdom of its own."
 gp_vladimir_f: "Grand Principality of Vladimir"
 gp_vladimir_f_desc: "The khan's patent for the throne of Vladimir passes from hand to hand: Tver has held it, Dmitry of Suzdal held it from 1360 to 1363, and Mikhail of Tver would win it back in 1371. Whoever holds Vladimir and the old Suzdalian lands can take the grand title without asking Moscow."
 gp_jochi_f: "Ulus of Jochi"
 gp_jochi_f_desc: "After 1359 more than twenty khans sat on the throne of Sarai in twenty years, until Tokhtamysh gathered the ulus again in 1380. A horde that rules three quarters of the steppe from the Dniester to the Yaik can raise the banner of Jochi once more."
 MGB: "Maghreb"
 MGB_ADJ: "Maghrebi"
 MGB_THE: "$common_string_prefix_article$"
 gp_maghreb_f: "Sultanate of the Maghreb"
 gp_maghreb_f_desc: "In 1337 the Marinid sultan Abu al-Hasan took Tlemcen, and in 1347 he entered Tunis: for a few months the Maghreb from the Atlantic to Ifriqiya obeyed one master, as it had under the Almohads. A sultan who holds Morocco, Tlemcen and Tunis together can make that union last."
 CLF: "Abbasid Caliphate"
 CLF_ADJ: "Abbasid"
 CLF_THE: "$common_string_prefix_article$"
 gp_abbasid_f: "Abbasid Caliphate"
 gp_abbasid_f_desc: "Since 1261 the heirs of the Abbasids have lived in Cairo as guests of the Mamluk sultans - caliphs without a caliphate. A Sunni power that holds Baghdad, the Holy Cities and Cairo can bring the caliph home to the city of al-Mansur and give the title its realm back."
 TCM: "Turcomania"
 TCM_ADJ: "Turkoman"
 gp_turkoman_f: "Turkoman Realm"
 gp_turkoman_f_desc: "The Black Sheep Turkomans would take Tabriz and Baghdad, and the White Sheep of Uzun Hasan would rule from Diyarbakir to the Persian Gulf. Tabriz, Armenia, the Jazira and Iraq under one Turkoman throne make the land that European maps call Turcomania a power of the first rank."
 FRS: "Fars"
 FRS_ADJ: "Farsi"
 gp_fars_f: "Fars"
 gp_fars_f_desc: "From Yazd the Muzaffarids took Kerman, then Shiraz from the Injuids in 1353 and Isfahan four years later; Hafez sang at Shah Shuja's court. Fars, Kerman, Yazd and Isfahan under one throne make a Persian kingdom of the south."
 SSO: "Southern Song"
 SSO_ADJ: "Southern Song"
 SSO_THE: "$common_string_prefix_article$"
 gp_southern_song_f: "Southern Song"
 gp_southern_song_f_desc: "The Mongols ended the Southern Song at Yamen in 1279, but the south has not forgotten it, and rebels will yet rise in its name. Whoever holds Hangzhou - the old capital Lin'an - and the lands between the Huai and the southern mountains can restore it."
 NYU: "Nanyue"
 NYU_ADJ: "Nanyue"
 gp_nanyue_f: "Nanyue"
 gp_nanyue_f_desc: "Zhao Tuo founded the kingdom of Southern Yue at Panyu about 204 BC, and the Southern Han ruled from the same city until 971. Lingnan behind its mountains has always been able to stand alone: whoever holds Guangzhou, Guangdong and Guangxi can make it a kingdom again."
 YEN: "Yan"
 YEN_ADJ: "Yan"
 gp_yan_f: "Kingdom of Yan"
 gp_yan_f_desc: "Ji, capital of the Warring States kingdom of Yan, is the Mongols' Dadu today; from here a Prince of Yan would one day march south and take the throne. Whoever holds the city and nine tenths of the North rules it as a kingdom of its own."
 gp_occitania_f: "Occitania"
 gp_occitania_f_desc: "The lands of the langue d'oc - Toulouse, Guyenne, Gascony, Provence - gathered into a kingdom of the south that takes no orders from Paris."
 LTG: "Lotharingia"
 LTG_ADJ: "Lotharingian"
 gp_lotharingia_f: "Lotharingia"
 gp_lotharingia_f_desc: "Lothair's middle kingdom rises again between France and the Empire: Lorraine, Champagne and Franche-Comte under one crown."
 HBE: "Holy British Empire"
 HBE_ADJ: "Imperial"
 gp_holy_british_f: "Holy British Empire"
 gp_holy_british_f_desc: "One crown over all England and all France: the Hundred Years' War has ended as no Plantagenet ever dreamed."
 IBU: "Iberian Union"
 IBU_ADJ: "Iberian"
 gp_iberian_union_f: "Iberian Union"
 gp_iberian_union_f_desc: "The Iberian game is played out: the whole peninsula, from Lisbon to Barcelona, under one crown."
