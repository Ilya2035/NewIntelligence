 gp_bp_sc_hyw_open: "the war for the French crown is on. If England takes half of Brittany, Normandy and Picardy before 1400, France must deal with it by 1400; if England takes Paris, France has 30 years to free it."
 gp_bp_sc_hyw_1: "French victory - England has left the continent: an island power with no ambitions in Europe beyond client states, no colonies for 50 years, the wooden walls (a cheap fleet) for 100. France has 15 years to land in Britain."
 gp_bp_sc_hyw_1_ambition: "French victory, a century on - England, much stronger than France again, has taken up the old kings' ambitions: a war for France is being prepared."
 gp_bp_sc_hyw_2: "French foothold - France holds land in Britain. Both sides have 20 years: if the French still stand there when the last war is over, England will fall apart."
 gp_bp_sc_hyw_3: "English advantage - England holds Brittany, Normandy and Picardy, the spirit of Crecy. France must deal with it by 1400."
 gp_bp_sc_hyw_4: "the break-up of France - Paris was not freed in 30 years: Brittany, Normandy, Burgundy, Provence, Aquitaine and a crowd of counties are free; they seek the Empire and its protection, the great duchies contend to unite France again, England makes client states."
 gp_bp_sc_hyw_5: "dual monarchy - Paris is English. The French crown has 30 years to free it, or France falls apart."
 gp_bp_sc_hyw_6: "the last war - 1400 has come and England is still on the continent. Three years of war decide it: Paris taken - dual monarchy, England driven out - French victory, neither - stalemate."
 gp_bp_sc_hyw_7: "stalemate - nobody won the last war. England has lost its guarantees in France: its land there is out of control and its vassals' people keep rising; France is worn out for 20 years; the two crowns leave each other alone."
 gp_bp_sc_hyw_8: "the break-up of England - the French foothold held: Northumberland, Lancaster, Cornwall and Wales are free and want England back, the Irish fiefs are free, Scotland's hour has come; English colonies only after 100 years."
