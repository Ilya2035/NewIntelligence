 ### v0.3 Regional formables
 GHU: "Great Hungary"
 GHU_ADJ: "Great Hungarian"
 gp_great_hungary_f: "Great Hungary"
 gp_great_hungary_f_desc: "The Crown of Saint Stephen rules the whole Carpathian basin, from the Tatras to the Sava and from Transylvania to the Leitha. Nine tenths of the Carpathians are ours: the realm should bear a name to match."
 gp_commonwealth_f: "Commonwealth by the Sword"
