 # =====================================================================================================
 # New Intelligence: Geopolicy (internal prefix gp_) - English localization (Russian copy in russian/).
 # Format: UTF-8 BOM, "l_english:" first line, one space before each key, no version numbers.
 # =====================================================================================================

 ### Game concepts (main_menu/common/game_concepts/gp_concepts.txt)
 game_concept_gp_geopolitics: "Geopolicy"
 game_concept_gp_zones_of_interest: "zones of interest"
 game_concept_gp_geopolitics_desc: "Every country plays a role instead of eating everything around it. It secures its own [area|e] and [region|e] first (its #bold core#! zone), then the lands it historically contested (its #bold sphere#!), and only as a regional hegemon its #bold distant ambitions#!. Roles - consolidator, regional power, hegemon, empire, besieged, status quo - are recalculated every year from the share of the home region the country owns and from the [gp_regional_threat|e]. Culture and faith shape who is outraged by whom, intruders from another sub-continent or faith are resisted together, and borders follow whole areas rather than lines."
 game_concept_gp_regional_threat: "Regional threat"
 game_concept_gp_regional_threat_desc: "Once a year every country looks for the strongest power present in its home [region|e] (or among its neighbours) that is at least one and a half times stronger than itself and either borders it or already holds land there. That power becomes the regional threat: opinion of it drops, countries that share the same threat and the same faith group drift together, war against the threat is preferred and the casus belli $gp_cb_contain_threat$ becomes available. A threat three times stronger on the border makes a country #bold besieged#!: it defends, arms and seeks a protector."

 ### Casus belli (in_game/common/casus_belli/gp_casus_belli.txt)
 gp_cb_contain_threat: "Contain the Regional Threat"
 gp_cb_contain_threat_desc: "This power has grown strong enough to threaten our whole [region|e]. We fight to cut it down to size: to free the lands it holds and to trim its borders, not to swallow it."

 ### Opinion modifiers (in_game/common/biases/gp_opinions.txt)
 gp_opinion_regional_threat: "Threatens our region"
 gp_opinion_foreign_intruder: "Foreign power in our region"
 gp_opinion_common_enemy: "Shares our regional threat"



 ### Game rules (main_menu/common/game_rules/gp_game_rules.txt)
 rule_gp_rule_mode: "Geopolicy AI"
 setting_gp_mode_standard: "Standard"
 setting_gp_mode_standard_desc: "AI countries play geopolitical roles: they secure their own area and region first, respect zones of interest, react to the regional threat and to foreign intruders, and prefer clean borders."
 setting_gp_mode_strong: "Strong"
 setting_gp_mode_strong_desc: "As standard, and consolidators and regional powers value targets in their own region even more, while empires wait less after a war before the next one."
 setting_gp_mode_off: "Off"
 setting_gp_mode_off_desc: "No roles, stages, threat reactions or scripted war-target scoring. The define changes (whole areas and regions over scattered locations, closed exclaves, unattractive far land, faith-aware outrage) and the new formable countries remain."

