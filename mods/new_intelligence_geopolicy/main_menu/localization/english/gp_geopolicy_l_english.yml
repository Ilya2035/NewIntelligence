 ### Formable countries (in_game/common/formable_countries/gp_formables.txt)
 GAE: "Alba"
 GAE_ADJ: "Alban"
 gp_alba_f: "Alba"
 gp_alba_f_desc: "In 1315 Edward Bruce crossed to Ireland and was crowned High King, while his brother Robert wrote to the Irish kings of one nation and one tongue. The Bruce project failed at Faughart; here it does not. With Edinburgh and a foothold in Ireland in our hands, the Gaels of both shores can be gathered under one crown: Alba."
 AMC: "Armorica"
 AMC_ADJ: "Armorican"
 gp_armorica_f: "Armorica"
 gp_armorica_f_desc: "Brittany and Normandy have been bound by marriage, war and the honour of Richmond for three centuries. A duke strong enough to hold both shores of the Channel approaches could revive the old name of the whole peninsula and its marches: Armorica."
 AGV: "Angevin Empire"
 AGV_ADJ: "Angevin"
 gp_angevin_f: "Angevin Empire"
 gp_angevin_f_desc: "From the Tweed to the Pyrenees, Henry II ruled England, Normandy, Anjou, Aquitaine and the homage of Brittany. His sons lost it within a lifetime. Whoever holds England and the old Plantagenet duchies again may claim the whole: the Angevin Empire."
 WND: "Wendland"
 WND_ADJ: "Wendish"
 gp_wendland_f: "Kingdom of the Wends"
 gp_wendland_f_desc: "The princes of Mecklenburg descend from Niklot, king of the Obotrites; the kings of Denmark still style themselves kings of the Wends; and in 1364 Albert of Mecklenburg took the Swedish crown. A Wendish kingdom on the southern Baltic shore is only a coronation away."
 BGD: "Burgundy"
 BGD_ADJ: "Burgundian"
 gp_burgundy_kingdom_f: "Kingdom of Burgundy"
 gp_burgundy_kingdom_f_desc: "In 1473 Charles the Bold came to Trier to be crowned king by the Emperor, and the crown was never placed on his head. The lands between the Jura and the North Sea are gathered; it remains to take the crown that history withheld."
 ILY: "Illyria"
 ILY_ADJ: "Illyrian"
 gp_illyria_f: "Illyria"
 gp_illyria_f_desc: "In 1377 Tvrtko of Bosnia was crowned at Mile as king of Serbia, Bosnia, the Coast and Croatia. His crown outlived him by a generation. Gathered again, the lands from the Drava to the Morava and the Adriatic make the kingdom of the western Balkans: Illyria."
 DAC: "Dacia"
 DAC_ADJ: "Dacian"
 gp_dacia_f: "Dacia"
 gp_dacia_f_desc: "For a few months in 1600 Michael the Brave held Wallachia, Transylvania and Moldavia in one hand; two centuries later the chanceries of Europe drew the same three principalities on their maps as the Kingdom of Dacia. Here the union holds."
 GVO: "Rus'"
 GVO_ADJ: "Ruthenian"
 gp_galicia_volhynia_f: "Kingdom of Rus'"
 gp_galicia_volhynia_f_desc: "In 1253 a papal legate crowned Daniel of Galicia king of Rus'. His kingdom of Halych and Volhynia stood for another century before Poland and Lithuania divided it. With Halych in our hands the royal crown of Rus' can be worn again."
 NVR: "Novgorodian Rus'"
 NVR_ADJ: "Novgorodian"
 gp_novgorod_rus_f: "Novgorodian Rus'"
 gp_novgorod_rus_f_desc: "Lord Novgorod the Great gathered the north long before Moscow gathered the centre. A Rus' united from the Volkhov rather than the Moskva would be a merchant realm looking to the Baltic and the White Sea; with the Rus' lands in our hands and our seat in Novgorod, it is ours to found."
 JRS: "Jerusalem"
 JRS_ADJ: "Jerusalemite"
 gp_jerusalem_f: "Kingdom of Jerusalem"
 gp_jerusalem_f_desc: "The kings of Cyprus and of Naples still bear the title; every crusade preached in this century aims at the Holy City. With Jerusalem and the Levant in Christian hands the kingdom of Godfrey and Baldwin can be restored."
 KHO: "Khorasan"
 KHO_ADJ: "Khorasani"
 gp_khorasan_f: "Khorasan"
 gp_khorasan_f_desc: "The Kartids of Herat and the Sarbadars of Sabzevar fight over the richest province of the fallen Ilkhanate. Whoever holds Herat and the two Khorasans can raise the Persian east into a kingdom of its own."


