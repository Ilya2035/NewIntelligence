 ### v0.4 Beyond the region (gp_region_effects.txt)
 gp_opinion_alliance_fatigue: "An alliance without a common cause"
 gp_opinion_regicide_plot: "A plot against our king"
 gp_cb_dynastic_claim: "Claim to the Throne"
 gp_cb_dynastic_claim_desc: "After the marriage of crowns our house has rights to their throne - or their court is so weak that it begs for a master. The war makes them our vassal; it takes no land."
 gp_target_dynastic_claim: "Take the crown by the claim to the throne"
 STATIC_MODIFIER_NAME_gp_sc_french_liberty: "French Liberty"
 STATIC_MODIFIER_DESC_gp_sc_french_liberty: "The French princes have left the Empire: every one of them fights to gather France under his own hand."
 gp_sc.1.title: "A Marriage of Crowns"
 gp_sc.1.desc: "Ten years of alliance have been sealed by a marriage: the heirs of Castile and its neighbour are now of one blood. But where two crowns meet, someone will one day want both. Until 1450 the courts will whisper of a plot - unless their friendship becomes true."
 gp_sc.1.a: "God keep both crowns"
 gp_sc.2.title: "Bandits on the Road"
 gp_sc.2.desc: "The royal train was ambushed, and the king did not come back. Bandits, they say; the court knows who gains. The stronger crown claims the orphaned throne: if it is not given up willingly, war will decide."
 gp_sc.2.a: "Such is the will of heaven"
 gp_sc.3.title: "The Plot Exposed"
 gp_sc.3.desc: "The attempt failed, and the trail leads to the court of an ally. The alliance is broken, the trust is gone. But the plotter will not let go: it keeps its claim to the throne and waits for its hour."
 gp_sc.3.a: "This will not be forgiven"
 gp_sc.4.title: "A Weakened Court"
 gp_sc.4.desc: "Our ally is so weak that its court stands only by our grace. No plots are needed: we have a claim to its throne, and sooner or later it will bow."
 gp_sc.4.a: "All in good time"
 gp_sc.5.title: "The French Princes Leave the Empire"
 gp_sc.5.desc: "For forty years the French lands lived under the wing of the Empire. Now the princes walk out: each wants to gather France under his own hand, and Vienna will not let them go without a war."
 gp_sc.5.a: "France will be one"
 gp_guard_the_king.title: "Strengthen the Royal Guard"
 gp_guard_the_king.desc: "The marriage of crowns bound us to Castile, and brought strangers to our court. Picked guards will not leave the king by day or by night."
 gp_guard_the_king.a: "A guard at every door"
 gp_order_at_court.title: "Put the Court in Order"
 gp_order_at_court.desc: "Check everyone who serves the king: servants, scribes, physicians. Whoever serves two masters must go."
 gp_order_at_court.a: "Loyal men at court"
 gp_loyal_men.title: "Surround the King with Loyal Men"
 gp_loyal_men.desc: "Nobles who owe the king everything will replace those whose loyalty is for sale."
 gp_loyal_men.a: "Loyalty for loyalty"
 gp_guard_the_king_tt: "The chance of an attempt on our king falls by 15 points (50 % -> 35 -> 20 -> 5 %)."
