 ### Формируемые страны (in_game/common/formable_countries/gp_formables.txt)
 GAE: "Альба"
 GAE_ADJ: "Альбийск"
 gp_alba_f: "Альба"
 gp_alba_f_desc: "В 1315 году Эдуард Брюс переправился в Ирландию и был коронован Верховным королём, а его брат Роберт писал ирландским королям об одном народе и одном языке. Замысел Брюсов рухнул при Фохарте; здесь - нет. С Эдинбургом и опорой в Ирландии в наших руках гэлов обоих берегов можно собрать под одной короной: Альба."
 AMC: "Арморика"
 AMC_ADJ: "Арморикск"
 gp_armorica_f: "Арморика"
 gp_armorica_f_desc: "Бретань и Нормандию три столетия связывали браки, войны и честь Ричмонда. Герцог, достаточно сильный, чтобы держать оба берега подступов к Ла-Маншу, может возродить древнее имя всего полуострова и его марок: Арморика."
 AGV: "Анжуйская империя"
 AGV_ADJ: "Анжуйск"
 gp_angevin_f: "Анжуйская империя"
 gp_angevin_f_desc: "От Твида до Пиренеев Генрих II правил Англией, Нормандией, Анжу, Аквитанией и держал присягу Бретани. Его сыновья потеряли всё за одну жизнь. Тот, кто снова держит Англию и старые герцогства Плантагенетов, может притязать на целое: Анжуйскую империю."
 WND: "Вендия"
 WND_ADJ: "Вендск"
 gp_wendland_f: "Королевство вендов"
 gp_wendland_f_desc: "Князья Мекленбурга ведут род от Никлота, короля ободритов; короли Дании по-прежнему титулуются королями вендов; а в 1364 году Альбрехт Мекленбургский взял шведскую корону. До вендского королевства на южном берегу Балтики - одна коронация."
 BGD: "Бургундия"
 BGD_ADJ: "Бургундск"
 gp_burgundy_kingdom_f: "Королевство Бургундия"
 gp_burgundy_kingdom_f_desc: "В 1473 году Карл Смелый приехал в Трир, чтобы император короновал его королём, - и корона так и не легла на его голову. Земли между Юрой и Северным морем собраны; осталось взять корону, в которой отказала история."
 ILY: "Иллирия"
 ILY_ADJ: "Иллирийск"
 gp_illyria_f: "Иллирия"
 gp_illyria_f_desc: "В 1377 году Твртко Боснийский был коронован в Миле королём Сербии, Боснии, Приморья и Хорватии. Его корона пережила его на поколение. Собранные вновь, земли от Дравы до Моравы и Адриатики составляют королевство западных Балкан: Иллирию."
 DAC: "Дакия"
 DAC_ADJ: "Дакийск"
 gp_dacia_f: "Дакия"
 gp_dacia_f_desc: "Несколько месяцев 1600 года Михай Храбрый держал в одной руке Валахию, Трансильванию и Молдавию; два столетия спустя канцелярии Европы рисовали те же три княжества на картах как Королевство Дакия. Здесь союз устоял."
 GVO: "Русь"
 GVO_ADJ: "Русск"
 gp_galicia_volhynia_f: "Королевство Русь"
 gp_galicia_volhynia_f_desc: "В 1253 году папский легат короновал Даниила Галицкого королём Руси. Его королевство Галича и Волыни простояло ещё век, пока Польша и Литва не разделили его. С Галичем в наших руках королевскую корону Руси можно надеть снова."
 NVR: "Новгородская Русь"
 NVR_ADJ: "Новгородск"
 gp_novgorod_rus_f: "Новгородская Русь"
 gp_novgorod_rus_f_desc: "Господин Великий Новгород собрал север задолго до того, как Москва собрала центр. Русь, объединённая с Волхова, а не с Москвы-реки, была бы купеческой державой, глядящей на Балтику и Белое море; с русскими землями в наших руках и престолом в Новгороде её можем основать мы."
 JRS: "Иерусалим"
 JRS_ADJ: "Иерусалимск"
 gp_jerusalem_f: "Иерусалимское королевство"
 gp_jerusalem_f_desc: "Короли Кипра и Неаполя всё ещё носят этот титул; каждый крестовый поход, о котором проповедуют в этом веке, нацелен на Святой город. С Иерусалимом и Левантом в христианских руках королевство Готфрида и Балдуина можно восстановить."
 KHO: "Хорасан"
 KHO_ADJ: "Хорасанск"
 gp_khorasan_f: "Хорасан"
 gp_khorasan_f_desc: "Куртиды Герата и Сербедары Себзевара бьются за богатейшую провинцию павшего Ильханата. Тот, кто держит Герат и оба Хорасана, может поднять персидский восток до собственного королевства."


