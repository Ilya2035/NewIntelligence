 gp_col_act_natives: "Дружба с туземцами"
 gp_col_act_natives_desc: "Обменяться дарами с местными, выведать тропы и воду. На 10 лет переселенцы идут в колонию на 25 % быстрее. Нужно, чтобы в провинции ещё жили туземцы."
 gp_col_act_cattle: "Скот и пшеница"
 gp_col_act_cattle_desc: "Завезти скот и семена: сразу добавляет поселенцев в нашу локацию провинции, на 20 лет +25 % еды и рост населения. Нужна хотя бы одна наша локация в провинции."
 gp_col_act_stockade: "Частокол"
 gp_col_act_stockade_desc: "Поставить укрепление: на 30 лет +25 % к обороне и +5 % к контролю. В споре за колониальную зону наши локации здесь весят вдвое. Нужна хотя бы одна наша локация в провинции."
 gp_col_act_settlers: "Позвать поселенцев"
 gp_col_act_settlers_desc: "Позвать крестьян из провинции столицы: два года они переселяются в колонию. Раз в 10 лет."
