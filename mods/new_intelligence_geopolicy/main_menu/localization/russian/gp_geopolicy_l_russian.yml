 ### v0.11 Колониальный этап (in_game/common/scripted_effects/gp_colonies.txt)
 rule_gp_rule_colonies: "Колониальный этап"
 setting_gp_colonies_on: "Включён"
 setting_gp_colonies_on_desc: "Новый Свет колонизируют только страны, которые доминируют в своём регионе (у остальных приморских стран Запада — только свои зоны). Мир за морем поделён на колониальные зоны: чтобы колонизировать, нужно 15 % влияния в зоне, при 40–60 % у двух держав — повод для войны за зону. Острова Тихого океана — кто первый, тот и хозяин. Внутренняя Африка тяжела для колонистов, африканские страны сильны дома. Больше двух зон Азии — штраф к расширению. Рухнула метрополия — её колонии свободны."
 setting_gp_colonies_off: "Выключен"
 setting_gp_colonies_off_desc: "Колонизация идёт по обычным правилам игры."
 STATIC_MODIFIER_NAME_gp_col_africa_hardship: "Тяжёлая земля"
 STATIC_MODIFIER_DESC_gp_col_africa_hardship: "Лихорадки, засухи и сопротивление местных: внутренняя Африка принимает переселенцев медленно. Проходит, когда земля становится чьим-то заморским владением."
 STATIC_MODIFIER_NAME_gp_col_african_homeland: "Земля предков"
 STATIC_MODIFIER_DESC_gp_col_african_homeland: "Нашу землю защищают люди, которые знают каждую тропу."
 STATIC_MODIFIER_NAME_gp_col_asian_overreach: "Перенапряжение в Азии"
 STATIC_MODIFIER_DESC_gp_col_asian_overreach: "Мы уже держим земли больше чем в двух зонах Азии: каждое новое завоевание там злит соседей сильнее и дольше врастает в державу."
 STATIC_MODIFIER_NAME_gp_col_natives: "Дружба с туземцами"
 STATIC_MODIFIER_DESC_gp_col_natives: "Местные показали нам землю и воду — переселенцы остаются охотнее."
 STATIC_MODIFIER_NAME_gp_col_cattle: "Скот и пшеница"
 STATIC_MODIFIER_DESC_gp_col_cattle: "Колония кормит себя сама."
 STATIC_MODIFIER_NAME_gp_col_stockade: "Частокол"
 STATIC_MODIFIER_DESC_gp_col_stockade: "Колония держится. В споре за колониальную зону каждая её локация весит вдвое."
 STATIC_MODIFIER_NAME_gp_col_settlers: "Зов переселенцев"
 STATIC_MODIFIER_DESC_gp_col_settlers: "Из метрополии идут новые поселенцы."
