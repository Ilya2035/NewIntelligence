 gp_col.1.title: "Хартия отозвана"
 gp_col.1.desc_right: "У нас нет права колонизировать Новый Свет: туда идут только державы, которые доминируют в своём регионе (держат с вассалами половину региона), а ведущие приморские державы Запада — в свои зоны. Хартия распущена, поселенцы вернулись."
 gp_col.1.desc_north: "Крайний Север и Сибирь — Кольский полуостров, Норрланд, Карелия, Архангельск, Урал — дело скандинавов и народов Восточной Европы. Нашим поселенцам там не выжить. Хартия распущена."
 gp_col.1.desc_group: "Эта земля вне зон, открытых для нашей страны: пока мы не доминируем в своём регионе, нам доступны только свои колониальные зоны (их видно во вкладке «Расклад сил», раздел «Колонии»). Хартия распущена."
 gp_col.1.desc_influence: "В этой колониальной зоне у нас меньше 15 % влияния — здесь уже хозяйничают другие. Сначала нужны свои колонии рядом, частоколы и пыл. Хартия распущена."
 gp_col.1.desc_island: "Этот остров уже принадлежит другой колониальной державе: на островах Тихого океана кто первый, тот и хозяин. Хартия распущена."
 gp_col.1.a: "Придётся искать другую землю"
