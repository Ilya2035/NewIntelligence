 STATIC_MODIFIER_NAME_gp_sc_wooden_walls: "Деревянные стены"
 STATIC_MODIFIER_DESC_gp_sc_wooden_walls: "После поражения на континенте корона строит флот: корабли дешевле в постройке и содержании — высадка на острова становится редкостью."
 STATIC_MODIFIER_NAME_gp_sc_maghreb_aid: "Помощь Магриба"
 STATIC_MODIFIER_DESC_gp_sc_maghreb_aid: "Единоверцы за морем стоят за нас: добровольцы и воины идут через пролив."
 STATIC_MODIFIER_NAME_gp_sc_french_favour: "Благосклонность Франции"
 STATIC_MODIFIER_DESC_gp_sc_french_favour: "Французская корона благоволит нам: её дворяне и деньги на нашей стороне."
 STATIC_MODIFIER_NAME_gp_sc_aragonese_crown: "Арагонская корона Италии"
 STATIC_MODIFIER_DESC_gp_sc_aragonese_crown: "Неаполь и острова под нашей рукой: Италия даёт войска, деньги и корабли."
 STATIC_MODIFIER_NAME_gp_sc_castile_troubles: "Кастильская смута"
 STATIC_MODIFIER_DESC_gp_sc_castile_troubles: "Полвека войн не дали Кастилии ни одной короны: гранды своевольничают, земля не слушается."
 STATIC_MODIFIER_NAME_gp_sc_divided_crowns: "Разделённые короны"
 STATIC_MODIFIER_DESC_gp_sc_divided_crowns: "Кастилия и Арагон устояли оба и истощают друг друга."
 STATIC_MODIFIER_NAME_gp_sc_portuguese_rise: "Подъём Португалии"
 STATIC_MODIFIER_DESC_gp_sc_portuguese_rise: "Пока великие короны бьются друг с другом, Португалия наводит порядок дома, а её люди верят в своё время."
 STATIC_MODIFIER_NAME_gp_sc_portuguese_pride: "Португальская гордость"
 STATIC_MODIFIER_DESC_gp_sc_portuguese_pride: "Португальцы не считают кастильскую корону своей: верность даётся с трудом."
 STATIC_MODIFIER_NAME_gp_sc_restoration: "Реставрация"
 STATIC_MODIFIER_DESC_gp_sc_restoration: "Португалия поднялась против Кастилии: ей нужно лишь удержать свою землю."
 STATIC_MODIFIER_NAME_gp_sc_foreign_crown: "Чужая корона"
 STATIC_MODIFIER_DESC_gp_sc_foreign_crown: "Земля по ту сторону Пиренеев не признаёт чужого короля: контроль слаб, беспорядки не утихают."
 gp_cb_scenario_war: "Война сценария"
 gp_cb_scenario_war_desc: "Ход истории сделал эту державу нашим врагом: с ней предстоит рассчитаться."
 gp_target_scenario_war: "Война, к которой ведёт история"
 gp_obj_scenario_ally: "Союзник по сценарию"
