 gp_commonwealth_f_desc: "Унии с Литвой не случилось, но польская корона и без неё собрала Балтийский край: девять десятых его земель — наши. Речь Посполитая рождается не из брака, а из побед."

 ### v0.4 За пределами региона (gp_region_effects.txt)
 gp_opinion_alliance_fatigue: "Союз без общей цели тяготит"
 gp_opinion_regicide_plot: "Заговор против нашего короля"
 gp_cb_dynastic_claim: "Право на престол"
 gp_cb_dynastic_claim_desc: "После брака корон наш дом имеет права на их трон — или их двор так ослаб, что сам просит хозяина. Война сделает их нашим вассалом, а не отнимет землю."
 gp_target_dynastic_claim: "Взять корону по праву престола"
 STATIC_MODIFIER_NAME_gp_sc_french_liberty: "Французская вольница"
 STATIC_MODIFIER_DESC_gp_sc_french_liberty: "Французские князья ушли из Империи: каждый из них бьётся за то, чтобы собрать Францию под своей рукой."
 gp_sc.1.title: "Брак корон"
 gp_sc.1.desc: "Десять лет союза скрепил брак: наследники Кастилии и её соседа теперь одной крови. Но там, где сходятся две короны, кто-то однажды захочет обе. До 1450 года при дворах будут шептаться о заговоре — если отношения не станут по-настоящему дружескими."
 gp_sc.1.a: "Да хранит Господь обе короны"
 gp_sc.2.title: "Разбойники на дороге"
 gp_sc.2.desc: "Королевский кортеж попал в засаду, и король не вернулся. Говорят — разбойники; при дворе знают, кому это выгодно. Сильнейшая из двух корон заявляет права на осиротевший трон: если его не отдадут добром, дело решит война."
 gp_sc.2.a: "Такова воля небес"
 gp_sc.3.title: "Заговор раскрыт"
 gp_sc.3.desc: "Покушение сорвалось, и следы ведут ко двору союзника. Союз разорван, доверия больше нет. Но заговорщик не отступится: у него остаётся право на престол, и он ждёт своего часа."
 gp_sc.3.a: "Этого не простят"
 gp_sc.4.title: "Ослабевший двор"
 gp_sc.4.desc: "Наш союзник так слаб, что его двор держится лишь нашей милостью. Заговоры не нужны: у нас есть право на его престол, и рано или поздно он склонится."
 gp_sc.4.a: "Всему своё время"
 gp_sc.5.title: "Французские князья уходят из Империи"
 gp_sc.5.desc: "Сорок лет французские земли жили под крылом Империи. Теперь князья уходят: каждый хочет собрать Францию под своей рукой, а Вена не намерена отпускать их без войны."
 gp_sc.5.a: "Франция будет одна"
 gp_guard_the_king.title: "Усилить королевскую стражу"
