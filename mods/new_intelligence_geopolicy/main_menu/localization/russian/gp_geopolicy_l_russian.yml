 ### v0.5 Сценарии Запада (gp_scenarios_west.txt)
 GP_BP_SC_TITLE: "Сценарии регионов"
 GP_BP_SC_HYW: "#bold Столетняя война:#! [Country.Custom('gp_bp_sc_hyw')]"
 GP_BP_SC_IRELAND: "#bold Ирландия:#! [Country.Custom('gp_bp_sc_ireland')]"
 GP_BP_SC_SCOTLAND: "#bold Шотландия:#! [Country.Custom('gp_bp_sc_scotland')]"
 GP_BP_SC_IBERIA: "#bold Иберия:#! [Country.Custom('gp_bp_sc_iberia')]"
 gp_bp_sc_hyw_open: "идёт война за французскую корону. Если до 1400 года Англия возьмёт половину Бретани, Нормандии и Пикардии, Франция должна разобраться с этим к 1400 году; если Англия возьмёт Париж, у Франции будет 30 лет, чтобы его освободить."
 gp_bp_sc_hyw_1: "французская победа — Англия ушла с континента: островная держава без амбиций в Европе, кроме вассалов, без колоний 50 лет, «деревянные стены» (дешёвый флот) на 100 лет. У Франции 15 лет на высадку в Британии."
 gp_bp_sc_hyw_1_ambition: "французская победа, век спустя — Англия снова намного сильнее Франции и вернулась к амбициям старых королей: готовится война за Францию."
 gp_bp_sc_hyw_2: "французский плацдарм — Франция держит землю в Британии. У обеих сторон 20 лет: если после конца последней войны французы всё ещё там, Англия распадётся."
 gp_bp_sc_hyw_3: "перевес Англии — Англия держит Бретань, Нормандию и Пикардию, дух Креси. Франция должна разобраться с этим к 1400 году."
 gp_bp_sc_hyw_4: "распад Франции — Париж не освобождён за 30 лет: Бретань, Нормандия, Бургундия, Прованс, Аквитания и множество графств свободны; они ищут защиты Империи, великие герцогства спорят за новое объединение Франции, Англия ставит вассалов."
 gp_bp_sc_hyw_5: "двойная монархия — Париж английский. У французской короны 30 лет, чтобы его освободить, иначе Франция распадётся."
 gp_bp_sc_hyw_6: "последняя война — настал 1400 год, а Англия всё ещё на континенте. Решают три года войны: взят Париж — двойная монархия, Англия изгнана — французская победа, ни то ни другое — тупик."
 gp_bp_sc_hyw_7: "тупик — последнюю войну никто не выиграл. Англия потеряла гарантии во Франции: её земли там неподконтрольны, а народ её вассалов постоянно бунтует; Франция истощена на 20 лет; короны больше не трогают друг друга."
 gp_bp_sc_hyw_8: "распад Англии — французский плацдарм устоял: Нортумберленд, Ланкастер, Корнуолл и Уэльс свободны и хотят собрать Англию заново, ирландские лены свободны, настал час Шотландии; английские колонии — только через 100 лет."
 gp_bp_sc_ireland_open: "гонка за остров продолжается."
 gp_bp_sc_ireland_1: "гэльский король объединил Ирландию."
 gp_bp_sc_ireland_2: "Англия быстро взяла остров — появились англо-ирландцы."
 gp_bp_sc_ireland_3: "Англия взяла остров поздно — ирландское национальное сознание не сломить."
 gp_bp_sc_ireland_quarrel: "гэльские лорды переругались — путь англичанам открыт."
 gp_bp_sc_scotland_open: "Шотландия под чужой властью."
 gp_bp_sc_scotland_1: "Старый союз держится — Шотландия не сдаётся, Франция за неё."
 gp_bp_sc_scotland_2: "Шотландия взяла верх в Британии."
 gp_bp_sc_iberia_open: "расстановка — Гранада ищет поддержки Магриба, Португалия — защитника (Англию или Францию), Арагон смотрит в Италию, Кастилия выбирает первый ход. В 1357 году — первый ход, в 1400 — приговор: к нему должно остаться не больше трёх корон."
 gp_bp_sc_iberia_first_1: "первый ход сделан — Кастилия идёт на Гранаду (Реконкиста)."
 gp_bp_sc_iberia_first_2: "первый ход сделан — Кастилия делает Португалию вассалом: у Португалии нет защитника."
 gp_bp_sc_iberia_first_3: "первый ход сделан — Кастилия идёт на Арагон."
 gp_bp_sc_iberia_first_4: "первый ход отложен — за Гранадой стоит Магриб, Кастилия выжидает и ищет мира с ней."
 gp_bp_sc_iberia_verdict_1: "час малых корон — к 1400 году Кастилия не взяла никого: смута в Кастилии, Кастилия и Арагон разделены, Португалия на подъёме; все идут на Гранаду."
 gp_bp_sc_iberia_verdict_2: "час Португалии — Кастилия и Арагон устояли оба и ослаблены на 20 лет, Португалия на подъёме и идёт на Кастилию."
 gp_bp_sc_iberia_union_1: "брачный союз — Арагон стал вассалом Кастилии; через 30 лет короны сольются."
 gp_bp_sc_iberia_union_2: "брачный союз — Кастилия стала вассалом Арагона; через 30 лет короны сольются."
 gp_bp_sc_iberia_union_3: "одна корона — Кастилия и Арагон слились в Испанию."
 gp_bp_sc_iberia_path_3: "партия Кастилии — Арагона больше нет: Гранада, потом море и Магриб; Португалию — вассалом или вечным миром."
 gp_bp_sc_iberia_path_4: "партия Арагона — Кастилии больше нет: Арагон идёт на Гранаду, с Португалией — вечный мир, потом море."
 gp_bp_sc_iberia_path_5: "партия Португалии — Кастилии и Арагона больше нет: Португалия собирает Иберию, потом Магриб и море."
 gp_bp_sc_iberia_path_6: "испанский султанат — Гранада держит треть Иберии; Франция идёт на неё войной, после победы на полуострове встанут её вассалы."
 gp_bp_sc_iberia_race: "Кастилия и Португалия одни — у Кастилии [Country.MakeScope.GetVariable('gp_bp_ib_race').GetValue|0] % их общей силы. От 75 % сильный идёт на слабого; ниже — мир, и земля слабого тихо возвращается к нему."
 GP_BP_GOAL: "#bold Наша цель:#! [Country.Custom('gp_goal')]"
 gp_goal_ib_1: "Реконкиста — выбить Гранаду до конца."
 gp_goal_ib_2: "Сделать Португалию вассалом (у неё нет защитника), через 50 лет — присоединить."
 gp_goal_ib_3: "Война с Арагоном за Испанию."
 gp_goal_ib_4: "Мир с Гранадой, пока за ней стоит Магриб; ждать первого хода в 1357 году."
 gp_goal_ib_5: "Иберия наша — море, колонии и Магриб."
 gp_goal_ib_6: "Когда-нибудь подчинить Португалию."
 gp_goal_ib_7: "Вечный мир с Португалией; море и колонии."
 gp_goal_ib_11: "Итальянская корона — Неаполь вассалом, Сицилия или Сардиния; дружба Франции (мнение 150) и союз с Португалией."
 gp_goal_ib_12: "Война с Кастилией за Испанию — землю Португалии не трогать."
 gp_goal_ib_13: "Добить Гранаду."
 gp_goal_ib_14: "Новая Испания — море и колонии; с Португалией вечный мир."
 gp_goal_ib_21: "Найти защитника: союз с Англией (лучше) или Францией — до первого хода Кастилии в 1357 году."
 gp_goal_ib_22: "Держать границу: защитник есть, Кастилия не смеет напасть."
 gp_goal_ib_23: "Час Португалии — война с Кастилией."
 gp_goal_ib_24: "Вместе со всеми — на Гранаду."
 gp_goal_ib_25: "Собрать Иберию."
 gp_goal_ib_26: "Иберия наша — море, колонии, Магриб."
 gp_goal_ib_27: "Под кастильской короной: после 30 лет при верности 40+ — присоединение; если за 100 лет не вышло — Реставрация и свобода навсегда."
 gp_goal_ib_31: "Заручиться поддержкой Магриба — Марокко, Тлемсен, Тунис (союз или мнение 100)."
 gp_goal_ib_32: "С Магрибом за спиной — война с Кастилией."
 gp_goal_ib_33: "Испанский султанат — забрать Испанию."
 gp_goal_ib_34: "Последний рубеж — все против Гранады."
 gp_goal_eng_0: "Война за французскую корону: до 1400 года взять половину Бретани, Нормандии и Пикардии — или Париж."
 gp_goal_eng_3: "Перевес: держать Бретань, Нормандию и Пикардию, взять Париж до 1400 года."
 gp_goal_eng_5: "Двойная монархия: держать Париж 30 лет — тогда Франция распадётся."
 gp_goal_eng_6: "Последняя война: взять Париж за три года войны."
 gp_goal_eng_7: "Тупик: гарантии во Франции утрачены — выделить вассальные герцогства, Францию не трогать."
 gp_goal_eng_1: "Островная держава: флот, вассалы в Германии и Нидерландах, против Франции — через союзников; колонии через 50 лет."
 gp_goal_eng_ambition: "Амбиции старых королей: война за Францию."
 gp_goal_eng_2: "Сбросить французов в море за 20 лет — сильнее всего бить в последние 15."
 gp_goal_eng_4: "Ставить вассалов во Франции."
 gp_goal_eng_8: "Собрать Англию заново."
 gp_goal_fra_0: "Война за корону: изгнать Англию с континента, не отдать Бретань, Нормандию, Пикардию и Париж."
 gp_goal_fra_3: "Разобраться с Англией к 1400 году."
 gp_goal_fra_5: "Освободить Париж за 30 лет — иначе распад."
 gp_goal_fra_6: "Последняя война: изгнать Англию за три года войны."
 gp_goal_fra_7: "Тупик: 20 лет истощения, Англию не трогать."
 gp_goal_fra_1: "Высадка: за 15 лет взять две локации в Британии."
 gp_goal_fra_2: "Удержать плацдарм в Британии 20 лет — и Англия распадётся."
 gp_goal_fra_4: "Собрать Францию заново."
 gp_goal_fra_8: "Ставить вассалов в Британии."
