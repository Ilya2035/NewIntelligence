l_russian:
 # =====================================================================================================
 # New Intelligence: Geopolicy (внутренний префикс gp_) - русская локализация (английская копия в english/).
 # Формат: UTF-8 BOM, "l_russian:" первой строкой, один пробел перед ключом, без номеров версий.
 # =====================================================================================================

 ### Понятия (main_menu/common/game_concepts/gp_concepts.txt)
 game_concept_gp_geopolitics: "Геополитика"
 game_concept_gp_zones_of_interest: "зоны интересов"
 game_concept_gp_geopolitics_desc: "Каждая страна играет свою роль, а не пожирает всё вокруг. Сначала она собирает свою [area|e] и свой [region|e] (#bold ядро#!), потом земли, на которые исторически претендовала (#bold сферу#!), и только как региональный гегемон - #bold дальние амбиции#!. Роли - собиратель, региональная держава, гегемон, империя, осаждённая, статус-кво - пересчитываются каждый год по доле домашнего региона во владении и по [gp_regional_threat|e]. Культура и вера определяют, кто на кого возмущается, пришельцев с другого субконтинента или другой веры встречают сообща, а границы идут по целым областям, а не линиями."
 game_concept_gp_regional_threat: "Угроза региону"
 game_concept_gp_regional_threat_desc: "Раз в год каждая страна ищет самую сильную державу в своём домашнем [region|e] (или среди соседей), которая как минимум в полтора раза сильнее её и либо граничит с ней, либо уже держит там землю. Эта держава становится угрозой региону: мнение о ней падает, страны с той же угрозой и той же верой тянутся друг к другу, войну против угрозы предпочитают, и открывается повод для войны $gp_cb_contain_threat$. Угроза втрое сильнее на границе делает страну #bold осаждённой#!: та обороняется, вооружается и ищет защитника."

 ### Поводы для войны (in_game/common/casus_belli/gp_casus_belli.txt)
 gp_cb_contain_threat: "Сдержать региональную угрозу"
 gp_cb_contain_threat_desc: "Эта держава стала так сильна, что угрожает всему нашему [region|e]. Мы воюем, чтобы урезать её: освободить захваченные ею земли и обрезать её границы, а не проглотить её."

 ### Модификаторы мнения (in_game/common/biases/gp_opinions.txt)
 gp_opinion_regional_threat: "Угрожает нашему региону"
 gp_opinion_foreign_intruder: "Иноземная сила в нашем регионе"
 gp_opinion_common_enemy: "Общая угроза региону"



 ### Правила игры (main_menu/common/game_rules/gp_game_rules.txt)
 rule_gp_rule_mode: "Геополитика ИИ"
 setting_gp_mode_standard: "Стандартная"
 setting_gp_mode_standard_desc: "Страны ИИ играют геополитические роли: сначала собирают свою область и регион, уважают зоны интересов, реагируют на угрозу региону и на иноземных пришельцев и предпочитают красивые границы."
 setting_gp_mode_strong: "Усиленная"
 setting_gp_mode_strong_desc: "Как стандартная, но собиратели и региональные державы ещё сильнее ценят цели в своём регионе, а империи меньше выжидают после войны перед следующей."
 setting_gp_mode_off: "Выключена"
 setting_gp_mode_off_desc: "Без ролей, стадий, реакции на угрозу и скриптовой оценки целей войны. Изменения defines (целые области и регионы вместо разрозненных локаций, закрытые анклавы, непривлекательная дальняя земля, возмущение с учётом веры) и новые формируемые страны остаются."

 ### Решение (in_game/common/decisions/gp_decisions.txt)
 gp_geopolitical_overview.title: "Геополитический обзор"
 gp_geopolitical_overview.desc: "Где мы стоим в своём [region|e]? Строки ниже показывают, что логика [gp_geopolitics|e] знает о нас: измерена ли наша доля домашнего региона, найдена ли [gp_regional_threat|e] (она же открывает повод для войны $gp_cb_contain_threat$) и следуем ли мы историческому профилю зон или общему. Отчёт обновляется раз в год; это решение обновляет его сейчас."
 gp_geopolitical_overview.a: "Обновить отчёт"
 gp_overview_share_tt: "Наша доля домашнего региона в этом году измерена."
 gp_overview_no_share_tt: "Наша доля домашнего региона ещё не измерена."
 gp_overview_threat_tt: "Угроза региону определена: против неё доступен повод для войны $gp_cb_contain_threat$, а наше мнение о ней понижено."
 gp_overview_no_threat_tt: "Ни одна держава в нашем регионе не настолько сильна, чтобы считаться угрозой региону."
 gp_overview_profile_tt: "Мы следуем историческому профилю зон (ядро, сфера, дальние амбиции)."
 gp_overview_generic_tt: "Мы следуем общему профилю зон: собрать домашний регион."
 gp_overview_refresh_tt: "Немедленно пересчитать угрозу региону, иноземных пришельцев в нашем регионе и общий фронт."

