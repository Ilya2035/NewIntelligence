 gp_cb_scenario_vassal: "Подчинение по сценарию"
 gp_cb_scenario_vassal_desc: "Ход истории требует, чтобы эта корона склонилась перед нами: её столица и вассальная клятва, а не её земля."
 gp_target_scenario_vassal: "Подчинить корону, как велит история"
 rule_gp_rule_alliance: "Союзы"
 setting_gp_alliance_reasons: "По расчёту"
 setting_gp_alliance_reasons_desc: "Порога мнения нет: страна, которой предлагают союз, сама взвешивает причины. Против — соперник за тот же регион, наша собственная угроза, разгромленный или только что побитый партнёр, союзник из другого региона без общего врага, а до 1450 года — союз через границу западной игры (Франция, Иберия, Британия, Ирландия). За — общая угроза (чем она больше, тем весомее), прежде всего чужеземный захватчик, грозящий обоим: тогда соперничество региона и разгром партнёра, побитого тем же захватчиком, не в счёт; а также старая дружба. Уже заключённые союзы остаются."
 setting_gp_alliance_friends: "Только друзья"
 setting_gp_alliance_friends_desc: "Те же причины, и вдобавок союз можно предложить, только если мнение обеих стран друг о друге не ниже 100. Уже заключённые союзы остаются."
 setting_gp_alliance_any: "Как в игре"
 setting_gp_alliance_any_desc: "Обычные правила игры: союз возможен при неотрицательном мнении."
 gp_alliance_needs_friendship_tt: "Мнение обеих стран друг о друге не ниже 100"
