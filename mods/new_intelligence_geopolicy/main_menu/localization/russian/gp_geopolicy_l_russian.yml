 ### v0.3 Формируемые державы регионов
 GHU: "Великая Венгрия"
 GHU_ADJ: "Великовенгерск"
 gp_great_hungary_f: "Великая Венгрия"
 gp_great_hungary_f_desc: "Корона святого Стефана правит всем Карпатским бассейном — от Татр до Савы и от Трансильвании до Бургенланда. Девять десятых Карпат в наших руках: пора назвать державу по её размаху."
