 ### Модификатор мнения (in_game/common/biases/gp_opinions.txt)
 gp_opinion_common_victim: "Жертва того же захватчика"

 ### Правило игры «Чужеземный захватчик» (main_menu/common/game_rules/gp_game_rules.txt)
 rule_gp_rule_invader: "Чужеземный захватчик"
 setting_gp_invader_pact: "Общий фронт и союз"
 setting_gp_invader_pact_desc: "Держава другого региона, другого макрорегиона и другой религиозной группы, которая нападает на страны региона или держит его земли, становится угрозой региону для всех его стран: соседи смыкают ряды (общий фронт, союзы по расчёту, курс, оценка целей), а соперники региона откладывают распрю. Сверх того скрипт на время угрозы заключает временные союзы между странами ИИ общего фронта и снимает их соперничество; когда угроза проходит, такие союзы распадаются (костыль для проверки: когда оценка сама приведёт к союзам, режим не нужен). После двух проигранных войн в пределах 30 лет захватчик на 25 лет теряет интерес к этому региону. Скрипт не заключает заново союз, который одна из двух стран раньше расторгла. По умолчанию действует только в Иберии (правило «Где действует захватчик»)."
 setting_gp_invader_front: "Только общий фронт"
 setting_gp_invader_front_desc: "То же, но без скриптовых союзов и без снятия соперничества: союзы заключаются только по собственному расчёту ИИ (мнение, общая угроза, причины региона)."
 setting_gp_invader_off: "Выключен"
 setting_gp_invader_off_desc: "Чужеземных захватчиков нет: угроза региону определяется только по силе и соседству."

 ### Правило игры «Исторические поправки» (main_menu/common/game_rules/gp_game_rules.txt)
 rule_gp_rule_nudges: "Исторические поправки"
 setting_gp_nudges_on: "Включены"
 setting_gp_nudges_on_desc: "Только для стран ИИ. Четыре малых временных модификатора по просьбе автора, каждый привязан к историческому событию и объяснён в своей подсказке: «Упадок Маринидов» (Марокко, с 1349 года), «Войско Ланкастеров» (Англия) и «Распря арманьяков и бургундцев» (Франция) на время последней войны Столетней войны, «Галицкие походы» (Польша, после смерти последнего Пяста Галича и Волыни). Вместе с галицкими походами Польша получает национальные районы (core) на землях Червонной Руси, которые держат Галич и Волынь; это не модификатор: мод эти районы сам не снимает. Размеры и сроки модификаторов — в их подсказках. Если выключено правило «Следы сценариев» или «Геополитика ИИ», не выдаётся ничего из этого."
 setting_gp_nudges_off: "Выключены"
 setting_gp_nudges_off_desc: "Эти модификаторы и польские национальные районы (core) на землях Червонной Руси не выдаются; сценарии и поведение ИИ остаются."

 ### Правило игры «Где действует захватчик» (main_menu/common/game_rules/gp_game_rules.txt)
 rule_gp_rule_invader_scope: "Где действует захватчик"
 setting_gp_invader_iberia: "Только Иберия"
 setting_gp_invader_iberia_desc: "Чужеземный захватчик (прежде всего Марокко) существует только для стран, чья столица лежит в Иберии: Кастилии, Арагона, Португалии, Наварры. Остальной мир живёт без захватчиков. Это первая ступень внедрения: весь мир включается после первого пробного прогона в Иберии."
 setting_gp_invader_world: "Весь мир"
 setting_gp_invader_world_desc: "Захватчики есть в каждом регионе (османы против Балкан, мамлюки против Киликии и так далее). Не проверено в игре: возможны странные союзы, например Византия как «захватчик» бейликов Анатолии."

 ### Названия записей оценки целей v0.12.1 (ai_scripted_expansion_score/gp_expansion_scores.txt; показываются причиной в подсказке ИИ)
 gp_score_calm_baseline: "Дома улаживать нечего: чужая война без повода"
 gp_score_pressure_restraint: "Нас теснят: новые войны менее заманчивы"
 gp_score_prey_intact: "Целая великая держава из чужого региона"
 gp_score_prey_crushed: "Разгромленный сосед: лёгкая добыча"
 gp_score_invader_spent: "Мы потеряли интерес к этому региону"
