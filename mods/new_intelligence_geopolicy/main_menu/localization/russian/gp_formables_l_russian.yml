l_russian:
 # === New Intelligence: Geopolicy - региональные формируемые страны, вторая очередь (gp_formables.txt) ===
 # <TAG> / <TAG>_ADJ (основа прилагательного, окончание подставляет игра, как в ванильных Литовск / Венецианск) / <TAG>_THE и <key> / <key>_desc.
 MDC: "Арагон и Сицилии"
 MDC_ADJ: "Арагонск"
 gp_mediterranean_crown_f: "Средиземноморская корона"
 gp_mediterranean_crown_f_desc: "Со времён Сицилийской вечерни 1282 года Барселонский дом собирает острова западного моря: Сицилию, Мальорку, Сардинию. Добавьте Неаполь, как сделает в 1442 году Альфонс Великодушный, — и один двор будет править от Барселоны до Отрантского пролива: корона Арагона станет короной Средиземноморья."
 VSM: "Стато да Мар"
 VSM_ADJ: "Венецианск"
 gp_stato_da_mar_f: "Стато да Мар"
 gp_stato_da_mar_f_desc: "Зара и далматинские гавани, Модон и Корон — «глаза Республики», Негропонт и Кандия: кто держит их все, тот держит дорогу на Левант. Когда Венето, Далмация, Морея и Крит стоят под львом святого Марка, Венеция уже не город с колониями, а морская держава."
 BCR: "Чешская корона"
 BCR_ADJ: "Чешск"
 BCR_THE: "$common_string_prefix_article$"
 gp_bohemian_crown_f: "Земли Чешской короны"
 gp_bohemian_crown_f_desc: "В 1348 году Карл IV объявил Богемию, Моравию, Силезию и Лужицу единой и неделимой Короной Чешского королевства. Когда Прага, Силезия и все земли его грамоты в наших руках, Корона перестаёт быть строкой в грамоте и становится государством."
 DNM: "Дунайская монархия"
 DNM_ADJ: "Дунайск"
 DNM_THE: "$common_string_prefix_article$"
 gp_danubian_monarchy_f: "Дунайская монархия"
 gp_danubian_monarchy_f_desc: "Альбрехт Габсбург надел короны Венгрии и Богемии в 1438 году и умер на следующий год; лишь после Мохача Фердинанд I вернёт их Габсбургам. Если Вена, Прага и Буда подчиняются одной династии, Дунай от Альп до Альфёльда становится становым хребтом единой державы."
 LRS: "Литва и Русь"
 LRS_ADJ: "Литовск"
 gp_lithuania_rus_f: "Литва и Русь"
 gp_lithuania_rus_f_desc: "Гедимин называл себя королём литовцев и многих русинов, а Ольгерд утверждал, что вся Русь должна принадлежать Литве. С Вильной, Киевом и тремя четвертями земель Руси в наших руках великое княжество может принять королевскую корону, в которой история откажет Витовту в 1430 году."
 SGK: "Сербия и Греция"
 SGK_ADJ: "Сербск"
 SGK_THE: "$common_string_prefix_article$"
 gp_serbian_empire_f: "Царство сербов и греков"
 gp_serbian_empire_f_desc: "На Пасху 1346 года Стефан Душан венчался в Скопье царём сербов и греков и правил от Дуная до Фессалии; он умер в 1355 году, так и не дойдя до Константинополя. Сербия, Македония, Албания, Эпир и Фессалия под одним царём — и на этот раз держава не умрёт вместе с основателем."
 LOM: "Ломбардия"
 LOM_ADJ: "Ломбардск"
 gp_lombardy_f: "Ломбардское королевство"
 gp_lombardy_f_desc: "Джан Галеаццо Висконти купил герцогский титул Милана в 1395 году и уже готовил королевскую коронацию, когда в 1402 году его унесла чума. С Ломбардией, Эмилией, Пьемонтом и материковым Венето под змеем Висконти Милан может принять Железную корону и стать королевством."
 gp_vladimir_f: "Великое княжество Владимирское"
 gp_vladimir_f_desc: "Ханский ярлык на владимирский стол переходит из рук в руки: им владела Тверь, Дмитрий Суздальский держал его с 1360 по 1363 год, Михаил Тверской вновь получит его в 1371-м. Кто держит Владимир и старые суздальские земли, тот может принять великокняжеский титул, не спрашивая Москвы."
 gp_jochi_f: "Улус Джучи"
 gp_jochi_f_desc: "После 1359 года на сарайском престоле за двадцать лет сменилось больше двадцати ханов, пока Тохтамыш в 1380 году не собрал улус заново. Орда, что правит тремя четвертями степи от Днестра до Яика, может вновь поднять знамя Джучи."
 MGB: "Магриб"
 MGB_ADJ: "Магрибск"
 MGB_THE: "$common_string_prefix_article$"
 gp_maghreb_f: "Магрибский султанат"
 gp_maghreb_f_desc: "В 1337 году маринидский султан Абу-ль-Хасан взял Тлемсен, а в 1347-м вступил в Тунис: на несколько месяцев Магриб от Атлантики до Ифрикии подчинился одному государю, как при Альмохадах. Султан, который удержит вместе Марокко, Тлемсен и Тунис, может сделать этот союз прочным."
 CLF: "Аббасидский халифат"
 CLF_ADJ: "Аббасидск"
 CLF_THE: "$common_string_prefix_article$"
 gp_abbasid_f: "Аббасидский халифат"
 gp_abbasid_f_desc: "С 1261 года наследники Аббасидов живут в Каире гостями мамлюкских султанов — халифы без халифата. Суннитская держава, владеющая Багдадом, Священными городами и Каиром, может вернуть халифа в город аль-Мансура, а титулу — его державу."
 TCM: "Туркомания"
 TCM_ADJ: "Туркоманск"
 gp_turkoman_f: "Держава туркоманов"
 gp_turkoman_f_desc: "Туркоманы Кара-Коюнлу возьмут Тебриз и Багдад, а Ак-Коюнлу Узун-Хасана будут править от Диярбакыра до Персидского залива. Тебриз, Армения, Джезира и Ирак под одним туркоманским престолом превращают край, который европейские карты называют Туркоманией, в державу первого ранга."
 FRS: "Фарс"
 FRS_ADJ: "Фарсск"
 gp_fars_f: "Фарс"
 gp_fars_f_desc: "Из Йезда Музаффариды взяли Керман, затем в 1353 году отняли Шираз у Инджуидов, а через четыре года — Исфахан; при дворе шаха Шуджи пел Хафиз. Фарс, Керман, Йезд и Исфахан под одним престолом — это персидское царство юга."
 SSO: "Южная Сун"
 SSO_ADJ: "Южносунск"
 SSO_THE: "$common_string_prefix_article$"
 gp_southern_song_f: "Южная Сун"
 gp_southern_song_f_desc: "Монголы покончили с Южной Сун при Яньмэне в 1279 году, но юг её не забыл, и мятежники ещё поднимутся под её именем. Кто держит Ханчжоу — старую столицу Линьань — и земли между Хуайхэ и южными горами, тот может её восстановить."
 NYU: "Наньюэ"
 NYU_ADJ: "Наньюэск"
 gp_nanyue_f: "Наньюэ"
 gp_nanyue_f_desc: "Чжао То основал царство Южное Юэ в Паньюе около 204 года до н. э., а Южная Хань правила из того же города до 971 года. Линнань за своими горами всегда мог стоять сам по себе: кто держит Гуанчжоу, Гуандун и Гуанси, тот может вновь сделать его царством."
 YEN: "Янь"
 YEN_ADJ: "Яньск"
 gp_yan_f: "Царство Янь"
 gp_yan_f_desc: "Цзи, столица царства Янь эпохи Сражающихся царств, — сегодня монгольский Даду; отсюда однажды яньский ван двинется на юг и возьмёт престол. Кто держит этот город и девять десятых Северного Китая, тот правит Севером как собственным царством."
