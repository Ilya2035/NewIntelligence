 # === New Intelligence: Geopolicy - сценарии Запада, v0.12.1 (gp_scenarios_iberia.txt, gp_scenarios_hyw.txt, gp_alliance.txt, gp_scenario_modifiers.txt, gp_wargoals.txt) ===
 # Общее дело Иберии (цели 8 и 15), причины союза против захватчика и старой дружбы, цель Столетней войны и четыре малые исторические поправки автора.

 ### Иберия: общее дело (цели 8 и 15; gp_brief.txt)
 gp_goal_ib_8: "Общее дело — никаких войн с христианскими коронами, пока мы под давлением, чужая держава у порога или нет явного перевеса над соседями; ищем их дружбы и держим рубеж."
 gp_goal_ib_15: "Общее дело — мы под давлением (разбиты, под угрозой или измотаны войнами): старая ссора с Кастилией подождёт, держим рубеж и ищем союзников."
 gp_bp_sc_iberia_first_8: "первый ход отложен — Кастилия под давлением, чужая держава у порога или нет явного перевеса над соседями: общее дело, никаких войн с христианскими коронами."

 ### Причины союза (gp_alliance.txt; видны в подсказке дипломатии)
 GP_ALLY_INVADER: "Чужеземный захватчик грозит нам обоим"
 GP_ALLY_OLD_FRIEND: "Это наш старый друг"

 ### Столетняя война: цель войны (gp_wargoals.txt)
 gp_wg_hyw_continental_tt: "Цель Столетней войны позволяет захватывать только земли французского региона либо землю ленников Франции или Англии вне Британии и Ирландии."

 ### Четыре малые исторические поправки автора (gp_scenario_modifiers.txt; все за правилами игры, у каждой своя история и свои числа)
 STATIC_MODIFIER_NAME_gp_sc_marinid_decline: "Упадок Маринидов"
 STATIC_MODIFIER_DESC_gp_sc_marinid_decline: "Чёрная смерть и разгром Абу-ль-Хасана при Кайруане (1348), его гибель (1351), убийство Абу Инана (1358) и визири при слабых султанах: племена Гарба и Суса идут на войну неохотно, лёгкая конница уже не та. Малая историческая поправка для Марокко на 70 лет с 1349 года: размер армейского ополчения −8 %, боевой дух армии −3 %, мощь лёгкой кавалерии −8 %. Поправка автора мода; её можно отключить в правилах игры («Исторические поправки» или «Следы сценариев»)."
 STATIC_MODIFIER_NAME_gp_sc_lancastrian_host: "Войско Ланкастеров"
 STATIC_MODIFIER_DESC_gp_sc_lancastrian_host: "Контрактные отряды и лучники на жалованье Генриха IV и Генриха V (Шрусбери, 1403; Азенкур, 1415): меньшая, но выученная армия держится твёрже. Малая историческая поправка для Англии на 20 лет с начала последней войны Столетней войны: боевой дух армии +5 %, число рекрутов +5 %. Снимается, когда война решена. Поправка автора мода; её можно отключить в правилах игры («Исторические поправки» или «Следы сценариев»)."
 STATIC_MODIFIER_NAME_gp_sc_armagnac_feud: "Распря арманьяков и бургундцев"
 STATIC_MODIFIER_DESC_gp_sc_armagnac_feud: "Король Карл VI безумен с 1392 года, принцы делят регентство, а после убийства герцога Орлеанского (1407) двор раскалывается и тянет ополчение в разные стороны. Малая историческая поправка для Франции на 20 лет с начала последней войны Столетней войны: размер ополчения −5 %, боевой дух армии −3 %. Снимается, когда война решена. Поправка автора мода; её можно отключить в правилах игры («Исторические поправки» или «Следы сценариев»)."
 STATIC_MODIFIER_NAME_gp_sc_galician_campaign: "Галицкие походы"
 STATIC_MODIFIER_DESC_gp_sc_galician_campaign: "Последний Пяст Галича и Волыни, Болеслав-Юрий II, умер, и Казимир Великий предъявляет права на его наследство: пятнадцать лет польское войско бьётся за Червонную Русь в приподнятом духе, а земли в мирном договоре обходятся ему дешевле. Малая историческая поправка для Польши на 15 лет: боевой дух армии +5 %, эффективность военного счёта +10 %. Поправка автора мода; её можно отключить в правилах игры («Исторические поправки» или «Следы сценариев»)."
