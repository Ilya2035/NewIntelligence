 ### Вкладка «Штаб» — строки состояния и подсказки, добавленные правками ревью (модуль gui_army_tab). Строки состояния
 ### считаются по самой армии (списки полков / модификаторов); единственная строка по району — CW_HQ_ABSENT_LOC.
 ### CW_HQ_ABSENT вкладкой больше не используется (CW_HQ_PENALTY_TEXT удалён). Строка CW_HQ_COLONIAL_AT_HOME - по району
 ### (cw_sgui_loc_has_colonial_hq_at_home).
 CW_HQ_NO_HQ: "Штаба нет: армия не организована"
 CW_HQ_LONE: "Штабу не хватает полков (нужны хотя бы ещё два): армия не организована, штраф действует"
