l_russian:
 # =====================================================================================================
 # New Intelligence: Battle (internal prefix cw_) - русская локализация (основной язык мода; английская копия лежит рядом в english/).
 # Формат (research 11 §3): UTF-8 BOM, "l_russian:" первой строкой, один пробел перед ключом, без номеров
 # версий. Вложение других ключей - $key$ (только именительный падеж), склонения понятий -
 # [Concept('key', 'форма')|e], коды форматирования #T #W #V #G #R #bold ... #!, значковые иконки
 # @hint! @warning_icon! @arrow_bonus_tier_N!. Переносы строк - \n.
 # Названия полков cw_hq / cw_hq_colonial сравниваются интерфейсом как строки (Localize), поэтому они
 # должны оставаться уникальными среди названий типов полков.
 # =====================================================================================================

 ### Типы полков (in_game/common/unit_types/cw_headquarters.txt): <ключ> = название, <ключ>_desc = описание
 cw_hq: "Штаб армии"
 cw_hq_desc: "Офицерский корпус полевой армии — сотня штабных офицеров. Бонусов не даёт: только [Concept('army', 'армия')|e] со штабом (и хотя бы ещё двумя полками) ведёт [Concept('siege', 'осаду')|e] и оккупацию с обычной скоростью и сражается в полную силу, а без штаба получает штраф «$STATIC_MODIFIER_NAME_cw_no_hq$». Число штабов ограничено [Concept('age', 'эпохой')|e] и размером державы."
 cw_hq_colonial: "Колониальный штаб"
 cw_hq_colonial_desc: "Штаб, собранный для [Concept('overseas', 'заморского')|e] театра. Он организует армию только за морем: там он заменяет обычный штаб и даёт небольшой бонус «$STATIC_MODIFIER_NAME_cw_expeditionary$». Дома армия с одним лишь колониальным штабом сражается в полную силу, но не способна вести полноценную осаду («$STATIC_MODIFIER_NAME_cw_no_hq_siege_only$»). Отдельный лимит — по заморским театрам, не больше четырёх. Набирается только в заморских владениях."
 cw_hq_construction_demand: "Формирование штаба"
 cw_hq_maintenance_demand: "Содержание штаба"

 ### Строки расшифровки лимита полков (desc = "KEY" в cw_limit_values.txt; движок выводит их как "$KEY$: $VALUE|+=2$")
 CW_HQ_LIMIT_IMPERIAL: "Имперский штаб (300 и более собственных районов)"
 CW_HQ_LIMIT_AGE_AND_SIZE: "Дополнительные штабы (по эпохе, не более одного за каждые 75 собственных районов)"
 CW_HQ_LIMIT_CAP: "Максимум (не более 5)"
 CW_HQ_LIMIT_MIN: "Минимум (всегда хотя бы один)"
 CW_COLONIAL_HQ_LIMIT_THEATRE_EUROPE: "Заморский театр: Европа"
 CW_COLONIAL_HQ_LIMIT_THEATRE_ASIA: "Заморский театр: Азия"
 CW_COLONIAL_HQ_LIMIT_THEATRE_AFRICA: "Заморский театр: Африка"
 CW_COLONIAL_HQ_LIMIT_THEATRE_AMERICA: "Заморский театр: Америка"
 CW_COLONIAL_HQ_LIMIT_THEATRE_OCEANIA: "Заморский театр: Океания"
 CW_COLONIAL_HQ_LIMIT_LARGE_THEATRE: "Крупный театр (25+ районов там у нас или у подданного, с эпохи Реформации)"
 CW_COLONIAL_HQ_LIMIT_HUGE_THEATRE: "Обширный театр (60+ районов там у нас или у подданного, с эпохи Абсолютизма)"
 CW_COLONIAL_HQ_LIMIT_CAP: "Максимум (не более 4)"
 CW_HQ_LIMIT_ISOLATED: "Изолированная военная традиция (без дополнительных штабов)"

 ### Модификаторы армии (main_menu/common/static_modifiers/cw_unit_modifiers.txt)
 # Три варианта штрафа носят одно имя: интерфейс узнаёт любой из них по названию, а сила штрафа видна по числам.
 STATIC_MODIFIER_NAME_cw_no_hq: "Армия без штаба"
 STATIC_MODIFIER_DESC_cw_no_hq: "У этой армии нет [Concept('cw_headquarters', 'штаба')|e]: она не способна вести полноценную [Concept('siege', 'осаду')|e] и сражается несогласованно. Разместите штаб или объедините её с армией, у которой штаб уже есть."
 STATIC_MODIFIER_NAME_cw_no_hq_mild: "Армия без штаба"
 STATIC_MODIFIER_DESC_cw_no_hq_mild: "$STATIC_MODIFIER_DESC_cw_no_hq$\nМягкий вариант штрафа: дисциплина −30%, боевой дух −30% (правило игры «$rule_cw_rule_hq_penalty$», вариант «$setting_cw_hq_penalty_mild$»)."
 STATIC_MODIFIER_NAME_cw_no_hq_harsh: "Армия без штаба"
 STATIC_MODIFIER_DESC_cw_no_hq_harsh: "$STATIC_MODIFIER_DESC_cw_no_hq$\nЖёсткий вариант штрафа: дисциплина −60%, боевой дух −60% (правило игры «$rule_cw_rule_hq_penalty$», вариант «$setting_cw_hq_penalty_harsh$»)."
 # Осадный штраф колониального штаба и модификатор повстанцев нарочно носят ДРУГИЕ имена: маркер штрафа в интерфейсе узнаёт штраф «без штаба» по точному совпадению названия.
 STATIC_MODIFIER_NAME_cw_no_hq_siege_only: "Армия без штаба (только осады)"
 STATIC_MODIFIER_DESC_cw_no_hq_siege_only: "Этой армией дома, а не за морем, руководит только [Concept('cw_colonial_headquarters', 'колониальный штаб')|e], а он организует армию лишь в [Concept('overseas', 'заморском')|e] театре. Армия сражается в полную силу, но не способна вести здесь полноценную [Concept('siege', 'осаду')|e]. Разместите обычный штаб или верните армию за море."
 STATIC_MODIFIER_NAME_cw_rebel_disorder: "Беспорядок в войске повстанцев"
 STATIC_MODIFIER_DESC_cw_rebel_disorder: "Повстанческое войско сражается без настоящего офицерского корпуса: наносит меньше урона и быстрее ломается, но оккупирует с обычной скоростью."
 STATIC_MODIFIER_NAME_cw_expeditionary: "Экспедиционный корпус"
 STATIC_MODIFIER_DESC_cw_expeditionary: "Армией на [Concept('overseas', 'заморском')|e] континенте руководит [Concept('cw_colonial_headquarters', 'колониальный штаб')|e]: меньше потерь от истощения, выше скорость передвижения и восстановления боевого духа. На родном континенте бонус не действует."

 ### Стадии войны - модификаторы державы под управлением компьютера (main_menu/common/static_modifiers/cw_country_modifiers.txt);
 # видны в подсказке «поведенческие модификаторы» противника
 STATIC_MODIFIER_NAME_cw_stance_offensive: "Стадия войны: наступление"
 STATIC_MODIFIER_DESC_cw_stance_offensive: "Держава заметно сильнее своего главного противника: она ищет генерального сражения и готова рисковать."
 STATIC_MODIFIER_NAME_cw_stance_defensive: "Стадия войны: оборона"
 STATIC_MODIFIER_DESC_cw_stance_defensive: "Силы примерно равны силам главного противника: держава держится своих крепостей и родных земель."
 STATIC_MODIFIER_NAME_cw_stance_waiting: "Стадия войны: выжидание"
 STATIC_MODIFIER_DESC_cw_stance_waiting: "Держава ведёт наступательную войну, но ещё не готова к ней: война только началась или армия не набрала полной численности. Держава собирает силы, быстрее пополняет полки и ждёт союзников, прежде чем вступить в бой."
 STATIC_MODIFIER_NAME_cw_stance_harassing: "Стадия войны: изматывание"
 STATIC_MODIFIER_DESC_cw_stance_harassing: "Держава сильно уступает в численности или терпит поражение: она избегает главной армии противника, совершает набеги и осаждает крепости в его тылу."

 ### Автомодификатор (in_game/common/auto_modifiers/cw_auto_modifiers.txt)
 AUTO_MODIFIER_NAME_cw_isolated_tradition_auto: "Изолированная военная традиция"
 AUTO_MODIFIER_DESC_cw_isolated_tradition_auto: "Наше войско не знает ни постоянного штаба, ни строя «пика и мушкет» Старого Света. Традиция исчезнет, когда мы внедрим [Concept('institution', 'институт')|e] «$pike_and_shot$» или проведём реформу войска (решение «$cw_reform_war_host.title$»). Пока традиция действует, дополнительных слотов штабов нет."

 ### События (in_game/events/cw_events.txt - cw_events.N; in_game/events/cw_stance_events.txt - cw_stance.1)
 cw_events.1.title: "Штаб сформирован"
 cw_events.1.desc: "Новый [Concept('cw_headquarters', 'штаб')|e] сформирован и ждёт назначения. Откройте окно армии, которую он должен возглавить, вкладку «$CW_HQ_TAB$», и нажмите «$CW_HQ_ADD$». Штабы ничего не стоят: место, освободившееся после гибели армии со штабом, восполняется за 3 месяца."
 cw_events.1.a: "Назначим офицеров."
 cw_events.2.title: "Армия потеряла штаб"
 cw_events.2.desc: "Офицерский корпус армии «[cw_army.GetName]» уничтожен. Пока ей не назначен новый [Concept('cw_headquarters', 'штаб')|e], армия ведёт осады в разы медленнее и плохо сражается."
 cw_events.2.desc_generic: "Одна из наших армий лишилась офицерского корпуса. Пока ей не назначен новый [Concept('cw_headquarters', 'штаб')|e], она ведёт осады в разы медленнее и плохо сражается."
 cw_events.2.a: "Переформировать."
 cw_stance.1.t: "Противник сменил стадию войны"
 cw_stance.1.d: "Разведка доносит: держава [cw_enemy.GetName] изменила свой подход к ведению войны."
 cw_stance.1.d.offensive: "Разведка доносит: держава [cw_enemy.GetName] перешла в наступление и ищет генерального сражения."
 cw_stance.1.d.defensive: "Разведка доносит: держава [cw_enemy.GetName] перешла к обороне — держится своих крепостей и родных земель."
 cw_stance.1.d.waiting: "Разведка доносит: держава [cw_enemy.GetName] выжидает — собирает силы и пополнения, прежде чем вступить в бой."
 cw_stance.1.d.harassing: "Разведка доносит: держава [cw_enemy.GetName] избегает нашей главной армии и перешла к набегам и осадам в нашем тылу."
 cw_stance.1.a: "Принято к сведению."

 ### Решения (in_game/common/decisions/cw_decisions.txt, cw_native_decisions.txt)
 cw_toggle_auto_hq.title: "Доверить размещение штабов Генштабу"
 cw_toggle_auto_hq.desc: "Генеральный штаб будет сам расставлять наши [Concept('cw_headquarters', 'штабы')|e] по тем же правилам, что и для держав под управлением компьютера: каждый месяц свободные слоты получают самые крупные армии (дома — обычные штабы, за морем — колониальные). Лишние штабы при этом не расформировываются. Автоматическое размещение можно в любой момент отключить этим же решением."
 cw_toggle_auto_hq.a: "Пусть этим займётся Генштаб."
 cw_toggle_auto_hq.b: "Вернуть управление себе."
 cw_auto_hq_is_on_tt: "Размещение штабов сейчас автоматизировано"
 cw_auto_hq_is_off_tt: "Размещение штабов сейчас выполняется вручную"
 cw_auto_hq_enable_tt: "Отныне штабы будут размещаться автоматически (свободные слоты заполняются сразу)"
 cw_auto_hq_disable_tt: "Размещение штабов возвращается под ручное управление (существующие штабы остаются на месте)"
 cw_reform_war_host.title: "Реформировать войско"
 cw_reform_war_host.desc: "Наши воины до сих пор сражаются разрозненными отрядами, как и их предки. Создав постоянный штаб и переняв опыт чужеземных армий, мы покончим с изолированной военной традицией: исчезнет штраф к дисциплине, а нашим армиям откроются дополнительные слоты штабов."
 cw_reform_war_host.a: "Провести реформу."
 cw_reform_war_host_tt: "Наше войско получает постоянный штаб: изолированная военная традиция уходит в прошлое, открываются новые слоты штабов"

 ### Подсказка (in_game/common/scriptable_hints/cw_hints.txt; формат hints_l_russian.yml:346-350)
 hint_cw_army_without_hq: "Армия без штаба"
 hint_cw_army_without_hq_hint_text: "$hint_cw_army_without_hq_hint_text_1$\n\n$hint_cw_army_without_hq_hint_text_2$"
 hint_cw_army_without_hq_hint_text_1: "Одна из наших [Concept('armies', 'армий')|e] не имеет [Concept('cw_headquarters', 'штаба')|e] и получает штраф «$STATIC_MODIFIER_NAME_cw_no_hq$»: осады идут в разы медленнее, а в бою армия заметно слабее."
 hint_cw_army_without_hq_hint_text_2: "#T Рекомендации#!\n@arrow_bonus_tier_3! Откройте окно армии и на вкладке #W $CW_HQ_TAB$#! разместите штаб, если есть свободный слот.\n@arrow_bonus_tier_2! Объедините армию с той, у которой штаб уже есть.\n@hint! Число штабов ограничено [Concept('age', 'эпохой')|e] и размером державы. Свободные слоты видны в окне «$CW_OVERVIEW_TITLE$» (щелчок по плашке стадии войны под панелью уведомлений)."

 ### Правила игры (main_menu/common/game_rules/cw_game_rules.txt): rule_<правило>, setting_<вариант>, setting_<вариант>_desc
 rule_cw_rule_hq_penalty: "Штраф за отсутствие штаба"
 setting_cw_hq_penalty_standard: "Обычный"
 setting_cw_hq_penalty_standard_desc: "Армии без штаба бьются вдвое слабее и не могут ничего захватить: способность к осаде и штурму −100%, дисциплина −50%, боевой дух −50%."
 setting_cw_hq_penalty_mild: "Мягкий"
 setting_cw_hq_penalty_mild_desc: "Армии без штаба получают ослабленный штраф: способность к осаде −90%, к штурму −75%, дисциплина −30%, боевой дух −30%."
 setting_cw_hq_penalty_harsh: "Жёсткий"
 setting_cw_hq_penalty_harsh_desc: "Армии без штаба получают усиленный штраф: способность к осаде и штурму −100%, дисциплина −60%, боевой дух −60%."
 rule_cw_rule_warscore: "Переработка военного счёта"
 setting_cw_warscore_on: "Включена"
 setting_cw_warscore_on_desc: "Военный счёт за оккупацию и стоимость требований в мирном договоре складываются в основном за счёт городов и столицы; деревни почти ничего не стоят. За взятие вражеской столицы начисляется разовый бонус к военному счёту."
 setting_cw_warscore_off: "Выключена"
 setting_cw_warscore_off_desc: "Разовый бонус за столицу отключён. Параметры ценности районов в войне и цены по рангу в мирном договоре остаются (правило игры не может их переключить)."
 rule_cw_rule_native_penalty: "Изолированная военная традиция (штраф туземцам)"
 setting_cw_native_penalty_on: "Включена"
 setting_cw_native_penalty_on_desc: "Державы Америки (кроме подданных державы Старого Света, например колониальных стран) получают небольшой штраф к дисциплине и лишены дополнительных слотов штабов, пока не внедрят институт «$pike_and_shot$» или не реформируют войско."
 setting_cw_native_penalty_off: "Выключена"
 setting_cw_native_penalty_off_desc: "Штрафа для держав Америки нет."
 rule_cw_rule_stance_events: "События о стадии войны противника"
 setting_cw_stance_events_off: "Выключены"
 setting_cw_stance_events_off_desc: "Событие о смене стадии войны противника не показывается (плашка под панелью уведомлений всё равно её отображает)."
 setting_cw_stance_events_on: "Включены"
 setting_cw_stance_events_on_desc: "Событие сообщает, когда воюющий с нами противник меняет стадию войны."

 ### Игровые понятия (main_menu/common/game_concepts/cw_concepts.txt); ключи-синонимы cw_colonial_hq / cw_war_stances
 game_concept_cw_headquarters: "Штаб"
 game_concept_cw_headquarters_desc: "Полк офицерского корпуса в 100 человек, отдельный вид войск. Только [Concept('army', 'армия')|e] со штабом и хотя бы ещё двумя полками может захватывать земли и бьётся в полную силу; армия без штаба бьётся вдвое слабее и не захватывает ничего. Штабы бесплатны: место, освободившееся после гибели армии со штабом, восполняется за 3 месяца. Сколько штабов можно держать: всегда один; ещё один с эпохи Реформации при институте «Пика и мушкет»; ещё по одному за каждые 150 собственных [Concept('locations', 'районов')|e]; не больше пяти. За морем — отдельные колониальные штабы: маленькая колония даёт один, большая (от 25 районов) — два."
 game_concept_cw_colonial_headquarters: "Колониальный штаб"
 game_concept_cw_colonial_hq: "Колониальный штаб"
 game_concept_cw_colonial_headquarters_desc: "Отдельный лимит [Concept('cw_headquarters', 'штабов')|e], выдаваемый за каждый [Concept('overseas', 'заморский')|e] континент (театр): с эпохи Открытий по одному за театр, где у нас не меньше 5 районов или стоит армия от 3 полков, ещё по одному при 25 районах там — наших или подданных (с эпохи Реформации) — и при 60 (с эпохи Абсолютизма), всего не больше четырёх. Колониальный штаб организует армию, только пока она находится за морем, и там же даёт небольшой бонус «$STATIC_MODIFIER_NAME_cw_expeditionary$»; дома такая армия сражается в полную силу, но не способна осаждать («$STATIC_MODIFIER_NAME_cw_no_hq_siege_only$»), пока ей не разместят обычный штаб."
 game_concept_cw_war_stance: "Стадия войны"
 game_concept_cw_war_stances: "Стадии войны"
 game_concept_cw_war_stance_desc: "Текущая манера ведения войны державы под управлением компьютера: «$CW_STANCE_1$», «$CW_STANCE_2$», «$CW_STANCE_3$», «$CW_STANCE_4$» или «$CW_STANCE_0$». Стадия пересчитывается раз в месяц с учётом соотношения сил с главным противником, черт правителя и командующего, а также хода войны; меняется она не чаще раза в два месяца. Плашка под панелью уведомлений показывает стадию нашего главного противника; сразу после смены разведка в течение месяца сообщает «$CW_STANCE_0$»."

 ### Военная позиция ленников (in_game/common/subject_military_stances/cw_stances.txt; формат military_l_russian.yml:11-28)
 cw_escort_military_stance: "Приказ: держаться главной армии"
