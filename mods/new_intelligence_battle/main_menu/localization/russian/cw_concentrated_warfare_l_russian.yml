 CW_HQ_SIEGE_ONLY: "Действует осадное ограничение «$STATIC_MODIFIER_NAME_cw_no_hq_siege_only$» (обновляется при следующей проверке организации)"
 CW_HQ_ABSENT_LOC: "В этом районе нет армии со штабом: эта армия не организована"
 CW_HQ_EXEMPT: "Армия в изгнании: правила штабов на неё не распространяются"
 CW_HQ_AT_SEA: "Армия на кораблях: разместить или расформировать штаб можно после высадки"
 CW_HQ_PENALTY_INFO: "Армия без [Concept('cw_headquarters', 'штаба')|e] получает модификатор «$STATIC_MODIFIER_NAME_cw_no_hq$»; точные числа зависят от правила игры «$rule_cw_rule_hq_penalty$» (наведите курсор, чтобы увидеть все три варианта; значок модификатора на армии показывает действующие значения): обычный — способность к осаде −90%, к штурму −50%, дисциплина −50%, боевой дух −50%; мягкий — дисциплина −30%, боевой дух −30%; жёсткий — дисциплина −60%, боевой дух −60% (осада и штурм — как в обычном). Обычный штаб снимает штраф где угодно, колониальный — только за морем (дома армия с ним сражается в полную силу, но не осаждает), и в армии должно быть хотя бы ещё два полка: штаб без других полков или с единственным полком ничего не оккупирует."
 CW_HQ_SLOTS_TAB_TT: "$CW_HQ_SLOTS_TT$\n\nСчётчик обновляется при ежемесячной проверке организации, при нажатии кнопок этой вкладки, а также в начале и по окончании войны; штаб, набранный в конструкторе армии или потерянный в бою, учитывается при следующей проверке."
 CW_HQ_COLONIAL_SLOTS_TAB_TT: "$CW_HQ_COLONIAL_SLOTS_TT$\n\nСчётчик обновляется при ежемесячной проверке организации, при нажатии кнопок этой вкладки, а также в начале и по окончании войны. Штабы сверх лимита (театр потерян) сохраняются, но новые разместить нельзя."
 CW_HQ_ADD_RULES_TT: "$CW_HQ_ADD_TT$.\nАрмии в изгнании и отряды из одних пленных под правила штабов не подпадают и штаб получить не могут."
 CW_HQ_ADD_COLONIAL_RULES_TT: "$CW_HQ_ADD_COLONIAL_TT$.\nСвободный колониальный слот проверяется заново при нажатии, поэтому, если счётчик выше ещё не обновился, нажатие может не сработать. Армии в изгнании и отряды из одних пленных под правила не подпадают."
 CW_HQ_REMOVE_WARNING_TT: "$CW_HQ_REMOVE_TT$.\nСначала расформировываются обычные штабные полки, колониальные — следующим нажатием; армия, состоящая из одних штабов, расформировывается целиком."


