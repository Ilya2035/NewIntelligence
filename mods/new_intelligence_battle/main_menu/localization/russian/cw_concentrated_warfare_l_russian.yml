 ### Окно «Штабы» (in_game/gui/cw_hq_overview.gui)
 # CW_HQ_SLOTS / CW_HQ_COLONIAL_SLOTS используются и здесь (подпись над счётчиком), и на вкладке армии, где интерфейс
 # сразу за подписью выводит числа «занято/лимит» - в самих подписях чисел быть не должно.
 CW_OVERVIEW_TITLE: "Штабы"
 CW_OVERVIEW_HINT: "[Concept('cw_headquarters', 'Штаб')|e] — полк офицерского корпуса в 100 человек. Только армия со штабом и хотя бы ещё двумя полками организована и может захватывать земли; армия без штаба бьётся вдвое слабее и не захватывает ничего. Штаб формируется сам за 3 месяца после того, как место освободилось; его можно поставить в армию или сформировать отдельным отрядом в столице."
 CW_HQ_SLOTS: "Штабы:"
 CW_HQ_SLOTS_TT: "#T Лимит штабов#!\nВсегда один штаб; ещё один с эпохи Реформации, если принят институт «Пика и мушкет»; ещё по одному за каждые 150 собственных [Concept('locations', 'районов')|e]. Не больше пяти."
 CW_HQ_COLONIAL_SLOTS: "Колониальные штабы:"
 CW_HQ_COLONIAL_SLOTS_TT: "#T Лимит колониальных штабов#!\nДоступны с эпохи Открытий. По одному за каждый [Concept('overseas', 'заморский')|e] континент (театр), где у нас не меньше 5 районов или стоит наша армия от 3 полков; ещё по одному при 25 районах там — наших или подданных (с эпохи Реформации) — и при 60 (с эпохи Абсолютизма). Всего не больше четырёх."
 CW_AUTO_HQ_ON: "Размещение штабов: доверено Генштабу"
 CW_AUTO_HQ_OFF: "Размещение штабов: вручную"
 CW_AUTO_HQ_TT: "Когда автоматическое размещение включено, наши штабы каждый месяц распределяются по самым крупным армиям по тем же правилам, что и у компьютера: дома — обычные, за морем — колониальные (по одному на театр). Лишние штабы при этом не расформировываются. То же самое переключает решение «$cw_toggle_auto_hq.title$»."
