l_english:
 # =====================================================================================================
 # New Intelligence: Battle (internal prefix cw_) - English localization (Russian is the mod's primary language; keep both files in sync).
 # Format (research 11 §3): UTF-8 BOM, "l_english:" on line 1, one leading space per key, no version numbers.
 # Nesting $key$ (nominative labels only), concept links [key|e] / [key|E] (capitalized), format codes
 # #T #W #V #G #R #bold ... #!, text icons @hint! @warning_icon! @arrow_bonus_tier_N!, line breaks \n.
 # The regiment names cw_hq / cw_hq_colonial are compared by the GUI as strings (Localize), so they must stay
 # unique among unit type names.
 # =====================================================================================================

 ### Unit types (in_game/common/unit_types/cw_headquarters.txt): <key> = name, <key>_desc = description
 cw_hq: "Army Headquarters"
 cw_hq_desc: "The officer corps of a field army: a staff of one hundred officers. It grants no bonus; only an [army|e] with a headquarters can [siege|e] and capture enemy land and fights at full strength, while an army without one suffers the $STATIC_MODIFIER_NAME_cw_no_hq$ penalty and captures nothing. The number of headquarters is limited by [age|e] and by the size of the country."
 cw_hq_colonial: "Colonial Headquarters"
 cw_hq_colonial_desc: "A headquarters raised for an [overseas|e] theater. It organizes an army only overseas, where it replaces a regular headquarters and grants the small $STATIC_MODIFIER_NAME_cw_expeditionary$ bonus. At home an army led only by a colonial headquarters fights normally but cannot conduct a proper siege ($STATIC_MODIFIER_NAME_cw_no_hq_siege_only$). Separate limit per overseas theater, at most four. Recruitable only in overseas possessions."
 cw_hq_construction_demand: "Headquarters Construction"
 cw_hq_maintenance_demand: "Headquarters Upkeep"

