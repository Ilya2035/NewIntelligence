 CW_PLATE_ENEMY: "Main enemy:"
 CW_STANCE_0: "Unknown"
 CW_STANCE_1: "Offensive"
 CW_STANCE_2: "Defensive"
 CW_STANCE_3: "Waiting"
 CW_STANCE_4: "Harassing"
 CW_STANCE_0_TT: "#T $CW_STANCE_0$#!\nThe enemy's [cw_war_stance|e] is unknown: it changed recently and our intelligence has not caught up yet (reports arrive within a month), or the enemy is led by a human player."
 CW_STANCE_1_TT: "#T $CW_STANCE_1$#!\nThe enemy seeks a decisive battle: expect its main army to advance and keep your forces concentrated."
 CW_STANCE_2_TT: "#T $CW_STANCE_2$#!\nThe enemy holds its forts and home territory and waits for us to attack."
 CW_STANCE_3_TT: "#T $CW_STANCE_3$#!\nThe enemy is waiting: it gathers forces and allies and reinforces its regiments faster before acting."
 CW_STANCE_4_TT: "#T $CW_STANCE_4$#!\nThe enemy avoids our main army: it strikes small detachments and besieges forts in our rear."

