 CW_HQ_LIMIT_IMPERIAL: "Imperial staff (300 or more owned locations)"
 CW_HQ_LIMIT_AGE_AND_SIZE: "Additional headquarters (by age, capped at one per 75 owned locations)"
 CW_HQ_LIMIT_CAP: "Maximum (cap of 5)"
 CW_HQ_LIMIT_MIN: "Minimum (always at least one)"
 CW_COLONIAL_HQ_LIMIT_THEATRE_EUROPE: "Overseas theater: Europe"
 CW_COLONIAL_HQ_LIMIT_THEATRE_ASIA: "Overseas theater: Asia"
 CW_COLONIAL_HQ_LIMIT_THEATRE_AFRICA: "Overseas theater: Africa"
 CW_COLONIAL_HQ_LIMIT_THEATRE_AMERICA: "Overseas theater: America"
 CW_COLONIAL_HQ_LIMIT_THEATRE_OCEANIA: "Overseas theater: Oceania"
 CW_COLONIAL_HQ_LIMIT_LARGE_THEATRE: "Large theater (25+ locations there owned by us or by a subject, Age of Reformation or later)"
 CW_COLONIAL_HQ_LIMIT_HUGE_THEATRE: "Vast theater (60+ locations there owned by us or by a subject, Age of Absolutism or later)"
 CW_COLONIAL_HQ_LIMIT_CAP: "Maximum (cap of 4)"
 CW_HQ_LIMIT_ISOLATED: "Isolated military tradition (no additional headquarters)"

 ### Army modifiers (main_menu/common/static_modifiers/cw_unit_modifiers.txt)
 # The three penalty variants share one name: the GUI recognizes any of them by name, the strength shows in the numbers.
 STATIC_MODIFIER_NAME_cw_no_hq: "Army without Headquarters"
 STATIC_MODIFIER_DESC_cw_no_hq: "This army has no [cw_headquarters|e]: it fights without coordination and cannot capture enemy land, a location it takes goes straight back to its owner. Place a headquarters or merge it into an army that already has one."
 STATIC_MODIFIER_NAME_cw_no_hq_mild: "Army without Headquarters"
 STATIC_MODIFIER_DESC_cw_no_hq_mild: "$STATIC_MODIFIER_DESC_cw_no_hq$\nMild variant of the penalty: discipline −30%, morale −30% (game rule $rule_cw_rule_hq_penalty$, setting $setting_cw_hq_penalty_mild$)."
 STATIC_MODIFIER_NAME_cw_no_hq_harsh: "Army without Headquarters"
 STATIC_MODIFIER_DESC_cw_no_hq_harsh: "$STATIC_MODIFIER_DESC_cw_no_hq$\nHarsh variant of the penalty: discipline −60%, morale −60% (game rule $rule_cw_rule_hq_penalty$, setting $setting_cw_hq_penalty_harsh$)."
 # The siege-only tier and the rebel modifier carry DIFFERENT names on purpose: the GUI's penalty marker recognizes the no-HQ penalty by its exact name.
 STATIC_MODIFIER_NAME_cw_no_hq_siege_only: "Army without Headquarters (sieges only)"
 STATIC_MODIFIER_DESC_cw_no_hq_siege_only: "Only a [cw_colonial_headquarters|e] leads this army at home, and a colonial headquarters organizes an army only in an [overseas|e] theater. The army fights normally but cannot conduct a proper [siege|e] here. Place a regular headquarters or take the army back overseas."
 STATIC_MODIFIER_NAME_cw_rebel_disorder: "Rebel Disorder"
 STATIC_MODIFIER_DESC_cw_rebel_disorder: "A rebel host fights without a proper officer corps: it deals less damage and breaks sooner, but it occupies at normal speed."
 STATIC_MODIFIER_NAME_cw_expeditionary: "Expeditionary Corps"
 STATIC_MODIFIER_DESC_cw_expeditionary: "A [cw_colonial_headquarters|e] leads this army on an [overseas|e] continent: less attrition, faster marches and quicker morale recovery. The bonus does not apply on the home continent."

 ### War stances - country modifiers of AI countries (main_menu/common/static_modifiers/cw_country_modifiers.txt);
 # visible on the enemy's behavioral modifiers tooltip
 STATIC_MODIFIER_NAME_cw_stance_offensive: "War Stance: Offensive"
 STATIC_MODIFIER_DESC_cw_stance_offensive: "Clearly stronger than its main enemy, this country seeks the decisive battle and accepts risk."
 STATIC_MODIFIER_NAME_cw_stance_defensive: "War Stance: Defensive"
 STATIC_MODIFIER_DESC_cw_stance_defensive: "Roughly matched with its main enemy, this country holds its forts and home territory."
 STATIC_MODIFIER_NAME_cw_stance_waiting: "War Stance: Waiting"
 STATIC_MODIFIER_DESC_cw_stance_waiting: "This country is the attacker but not ready yet: the war is young or its army is still under strength. It gathers its forces, reinforces faster and waits for allies before committing."
 STATIC_MODIFIER_NAME_cw_stance_harassing: "War Stance: Harassing"
 STATIC_MODIFIER_DESC_cw_stance_harassing: "Heavily outnumbered or losing badly, this country avoids the main enemy army, raids and besieges forts in its rear."

 ### Auto modifier (in_game/common/auto_modifiers/cw_auto_modifiers.txt)
 AUTO_MODIFIER_NAME_cw_isolated_tradition_auto: "Isolated Military Tradition"
 AUTO_MODIFIER_DESC_cw_isolated_tradition_auto: "Our war host knows neither a permanent staff nor the pike-and-shot drill of the Old World. This ends when we embrace the [institution|e] $pike_and_shot$ or reform the war host (decision $cw_reform_war_host.title$). While the tradition lasts there are no additional headquarters slots."

 ### Events (in_game/events/cw_events.txt - cw_events.N; in_game/events/cw_stance_events.txt - cw_stance.1)
 cw_events.1.title: "Headquarters Formed"
 cw_events.1.desc: "A new [cw_headquarters|e] has been formed and awaits its assignment. Open the window of the army it should lead, go to the  and press 67 Headquarters cost nothing: a slot freed by the destruction of an army with a headquarters is filled again within 3 months."
 cw_events.1.a: "Assign the officers."
 cw_events.2.title: "An Army Has Lost Its Headquarters"
 cw_events.2.desc: "The officer corps of [cw_army.GetName] has been destroyed. Until a new [cw_headquarters|e] is assigned, the army cannot capture enemy land and fights at half strength."
 cw_events.2.desc_generic: "One of our armies has lost its officer corps. Until a new [cw_headquarters|e] is assigned, it cannot capture enemy land and fights at half strength."
 cw_events.2.a: "Reorganize."
 cw_events.3.title: "Capture Undone"
 cw_events.3.desc: "Our army took [cw_lost_location.GetName], but it has no [cw_headquarters|e]. Without one the troops cannot hold what they take, and the location went back to its owner. Only armies with a headquarters can capture enemy land."
 cw_events.3.desc_generic: "Our army took an enemy location, but it has no [cw_headquarters|e]. Without one the troops cannot hold what they take, and the location went back to its owner. Only armies with a headquarters can capture enemy land."
 cw_events.3.a: "We need a headquarters."
 cw_stance.1.t: "Enemy War Stance Changed"
 cw_stance.1.d: "Our spies report that [cw_enemy.GetName] has changed its approach to the war."
 cw_stance.1.d.offensive: "Our spies report that [cw_enemy.GetName] has gone on the offensive and seeks a decisive battle."
 cw_stance.1.d.defensive: "Our spies report that [cw_enemy.GetName] has taken a defensive stance, holding its forts and home territory."
 cw_stance.1.d.waiting: "Our spies report that [cw_enemy.GetName] is waiting, gathering forces and reinforcements before it commits."
 cw_stance.1.d.harassing: "Our spies report that [cw_enemy.GetName] avoids our main army and resorts to raids and sieges in our rear."
 cw_stance.1.a: "Noted."

 ### Decisions (in_game/common/decisions/cw_decisions.txt, cw_native_decisions.txt)
 cw_toggle_auto_hq.title: "Entrust Headquarters Placement to the General Staff"
 cw_toggle_auto_hq.desc: "The general staff will place our [cw_headquarters|e] on its own, by the same rules the AI uses: every month the free slots go to the largest armies (regular headquarters at home, colonial ones overseas). Surplus headquarters are not disbanded. Automatic placement can be switched off again at any time with this same decision."
 cw_toggle_auto_hq.a: "Let the staff handle it."
 cw_toggle_auto_hq.b: "Take back control."
 cw_auto_hq_is_on_tt: "Headquarters placement is currently automated"
 cw_auto_hq_is_off_tt: "Headquarters placement is currently manual"
 cw_auto_hq_enable_tt: "Headquarters will be placed automatically from now on (free slots are filled immediately)"
 cw_auto_hq_disable_tt: "Headquarters placement returns to manual control (existing headquarters stay)"
 cw_reform_war_host.title: "Reform the War Host"
 cw_reform_war_host.desc: "Our warriors still fight as isolated war bands, as their forefathers did. By adopting a permanent staff and the lessons of foreign armies we end the isolated military tradition: the discipline malus disappears and our armies gain additional headquarters slots."
 cw_reform_war_host.a: "Reform it."
 cw_reform_war_host_tt: "Our war host adopts a permanent staff: the isolated military tradition ends and headquarters slots open up"

 ### Hint (in_game/common/scriptable_hints/cw_hints.txt; format hints_l_english.yml:387-391)
 hint_cw_army_without_hq: "Army without Headquarters"
 hint_cw_army_without_hq_hint_text: "$hint_cw_army_without_hq_hint_text_1$\n\n$hint_cw_army_without_hq_hint_text_2$"
 hint_cw_army_without_hq_hint_text_1: "One of our [armies|e] has no [cw_headquarters|e] and suffers the $STATIC_MODIFIER_NAME_cw_no_hq$ penalty: it cannot capture enemy land and is markedly weaker in battle."
 hint_cw_army_without_hq_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Open the army window and place a headquarters from the #W $CW_HQ_TAB$#! tab, if a slot is free.\n@arrow_bonus_tier_2! Merge the army into one that already has a headquarters.\n@hint! The number of headquarters is limited by [age|e] and by the size of the country. Free slots are shown in the $CW_OVERVIEW_TITLE$ window (click the war-stance plate under the alert bar)."

 ### Game rules (main_menu/common/game_rules/cw_game_rules.txt): rule_<rule>, setting_<setting>, setting_<setting>_desc
 rule_cw_rule_hq_penalty: "Headquarters Penalty"
 setting_cw_hq_penalty_standard: "Standard"
 setting_cw_hq_penalty_standard_desc: "Armies without a headquarters fight at half strength and cannot take anything: siege and assault ability −100%, discipline −50%, morale −50%."
 setting_cw_hq_penalty_mild: "Mild"
 setting_cw_hq_penalty_mild_desc: "Armies without a headquarters get a milder penalty: siege ability −90%, assault ability −75%, discipline −30%, morale −30%."
 setting_cw_hq_penalty_harsh: "Harsh"
 setting_cw_hq_penalty_harsh_desc: "Armies without a headquarters get a harsher penalty: siege and assault ability −100%, discipline −60%, morale −60%."
 rule_cw_rule_warscore: "Warscore Rework"
 setting_cw_warscore_on: "On"
 setting_cw_warscore_on_desc: "Occupation warscore and peace cost come mostly from cities and the capital; villages are worth almost nothing. Taking the enemy capital grants a one-off bonus to warscore."
 setting_cw_warscore_off: "Off"
 setting_cw_warscore_off_desc: "The one-off capital bonus is disabled. The war-worth defines and the rank-based peace prices stay in force (they cannot be toggled by a rule)."
 rule_cw_rule_native_penalty: "Isolated Military Tradition (Native Penalty)"
 setting_cw_native_penalty_on: "On"
 setting_cw_native_penalty_on_desc: "Countries of the Americas (except subjects of an Old World power, such as colonial nations) suffer a mild discipline malus and get no additional headquarters slots until they embrace the $pike_and_shot$ institution or reform their war host."
 setting_cw_native_penalty_off: "Off"
 setting_cw_native_penalty_off_desc: "No penalty for the countries of the Americas."
 rule_cw_rule_stance_events: "Enemy War Stance Events"
 setting_cw_stance_events_off: "Off"
 setting_cw_stance_events_off_desc: "You are not notified by an event when an enemy changes its war stance (the plate under the alert bar still shows it)."
 setting_cw_stance_events_on: "On"
 setting_cw_stance_events_on_desc: "An event informs you when an enemy at war with you changes its war stance."

 ### Game concepts (main_menu/common/game_concepts/cw_concepts.txt); alias keys cw_colonial_hq / cw_war_stances
 game_concept_cw_headquarters: "Headquarters"
 game_concept_cw_headquarters_desc: "A 100-man officer corps regiment, a troop type of its own. Only an [army|e] with a headquarters can besiege and capture enemy land, even a headquarters standing alone. An army without one fights at half strength and captures nothing: a location it takes goes straight back to its owner. Headquarters cost no gold, losses are refilled from our own manpower, and upkeep is free. A lost headquarters forms again within 3 months and appears at once with 100 men. A captured headquarters is disbanded and never joins the enemy. How many you may keep: always one; one more from the Age of Reformation with the Pike and Shot institution; one more per 150 own [locations|e]; at most five. Overseas there are separate colonial headquarters: a small colony gives one, a big one (25+ locations) two."
 game_concept_cw_colonial_headquarters: "Colonial Headquarters"
 game_concept_cw_colonial_hq: "Colonial Headquarters"
 game_concept_cw_colonial_headquarters_desc: "A separate [cw_headquarters|e] pool granted per [overseas|e] continent (theater): from the Age of Discovery one per theater where we own at least 5 locations or keep an army of 3+ regiments, one more at 25 locations there, ours or our subjects' (Age of Reformation), and at 60 (Age of Absolutism), four in total at most. A colonial headquarters organizes an army only while it is overseas, where it also grants the small $STATIC_MODIFIER_NAME_cw_expeditionary$ bonus; at home such an army fights normally but cannot besiege ($STATIC_MODIFIER_NAME_cw_no_hq_siege_only$) until it receives a regular headquarters."
 game_concept_cw_war_stance: "War Stance"
 game_concept_cw_war_stances: "War Stances"
 game_concept_cw_war_stance_desc: "The current posture of an AI country at war: $CW_STANCE_1$, $CW_STANCE_2$, $CW_STANCE_3$, $CW_STANCE_4$ or $CW_STANCE_0$. The stance is recalculated monthly from the strength ratio against the main enemy, the traits of the ruler and the commander, the course of the war and the situation in its own region. When an enemy army with a headquarters enters our region, the country turns to defence at once; when no enemy headquarters army is near, it raids the enemy's land. The stance is expressed through the country's normal military stance, without modifiers. It changes at most once every two months. The plate under the alert bar shows the stance of our main enemy; for a month after a change our intelligence reports $CW_STANCE_0$."

 ### Subject military stance (in_game/common/subject_military_stances/cw_stances.txt; pattern military_l_english.yml:15-37)
 cw_escort_military_stance: "Order: Stay with the Main Army"
 cw_escort_military_stance_desc: "The [subject|e] will shadow our main army and cover our sieges instead of operating on its own."
 cw_escort_military_stance_desc_all: "All our [subjects|e] will shadow our main army and cover our sieges instead of operating on their own."

